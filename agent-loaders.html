/* the blob's spotlight: a wedge of light from the blob whose far end lands
   exactly on the two corners of the card's nearest edge */
function kvBeam(c) {
  const svg = c.$('#vCone'), poly = c.$('#vConeP'), grad = c.$('#vConeG'), blob = c.$('#core');
  let cur = null, lit = null;
  const corners = (a, r) => {
    const dx = r.x + r.w / 2 - a.x, dy = r.y + r.h / 2 - a.y;
    if (Math.abs(dx) * r.h > Math.abs(dy) * r.w) {          /* facing edge is vertical */
      const x = dx > 0 ? r.x : r.x + r.w;
      return [{ x, y: r.y }, { x, y: r.y + r.h }];
    }
    const y = dy > 0 ? r.y : r.y + r.h;                       /* facing edge is horizontal */
    return [{ x: r.x, y }, { x: r.x + r.w, y }];
  };
  const paint = (p) => {
    poly.setAttribute('points', p.map(q => `${q.x},${q.y}`).join(' '));
    const m = { x: (p[1].x + p[2].x) / 2, y: (p[1].y + p[2].y) / 2 };
    grad.setAttribute('x1', p[0].x); grad.setAttribute('y1', p[0].y);
    grad.setAttribute('x2', m.x); grad.setAttribute('y2', m.y);
  };
  return {
    async to(target, ms = 560) {
      const a = center(rectIn(blob)), r = rectIn(target);
      const next = [a, ...corners(a, r)];
      if (lit) lit.classList.remove('beamed');
      svg.classList.add('on');
      c.kick();
      if (!cur) { cur = next; paint(cur); await c.wait(160); }
      else {
        const from = cur.map(q => ({ ...q }));
        await c.tween(Math.min(520, ms), e => {
          cur = from.map((q, i) => ({ x: q.x + (next[i].x - q.x) * e, y: q.y + (next[i].y - q.y) * e }));
          paint(cur);
        }, ease.io);
      }
      cur = next; paint(cur);
      lit = target; target.classList.add('beamed');
      await c.wait(Math.max(0, ms - 520));
    },
    off() { svg.classList.remove('on'); if (lit) lit.classList.remove('beamed'); lit = null; },
  };
}

async function kvRunChecks(c, say) {
  const doc = c.$('#vDoc'), beam = c.$('#vBeam'), blob = c.$('#core'), rows = c.$$('.chk-row');
  const light = kvBeam(c);
  say('Reading submission'); c.state('think');
  await light.to(doc, 300);
  c.focus(doc, 6);
  doc.classList.add('lit');
  beam.classList.add('on');
  for (let k = 0; k < 3; k++) {
    await c.wait(360);
    c.fly(doc, blob, { html: '<span class="kfrag-f" style="--c:var(--blue)"></span>', ms: 460, scaleFrom: .6, scaleTo: .5, arc: 14 }).then(() => c.kick()).catch(() => {});
  }
  await c.wait(700);
  beam.classList.remove('on');
  doc.classList.remove('lit'); doc.classList.add('read');
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.3 });

  say('Running checks'); c.state('tool');
  for (const [i, r] of rows.entries()) {
    await light.to(r);
    c.focus(r, 4);
    r.dataset.s = 'run'; r.classList.add('scanning');
    r.querySelector('.st').innerHTML = SPIN;
    await c.wait(820);
    const warn = KV_CHK[i].warn;
    r.classList.remove('scanning');
    r.dataset.s = warn ? 'warn' : 'ok';
    r.querySelector('.st').innerHTML = warn ? WARN : OK;
    c.anim(r.querySelector('.st'), [{ transform: 'scale(.4)' }, { transform: 'scale(1.18)', offset: .6 }, { transform: 'none' }], { duration: 360, fill: 'none' }).catch(() => {});
    c.ripple(r, warn ? 'var(--amber)' : 'var(--blue)', { scaleTo: 1.06 });
    if (warn) {
      say('Reviewing a flag'); c.state('think');
      r.classList.add('scanning');
      await c.wait(1200);
      r.classList.remove('scanning');
      r.dataset.s = 'ok'; r.querySelector('.st').innerHTML = OK;
      c.ripple(r, 'var(--blue)', { scaleTo: 1.06 });
      say('Running checks'); c.state('tool');
    }
    await c.wait(160);
  }
  light.off();
  c.focus(blob, 4);
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
  await c.wait(500);
}

async function kvRunApprovals(c, say) {
  const blob = c.$('#core'), cards = c.$$('.telco');
  const light = kvBeam(c);
  say('Requesting approvals'); c.state('tool');
  c.focus(blob, 4);
  c.ripple(blob, 'var(--blue)', { scaleTo: 1.5 });
  await Promise.all(cards.map(async (t, i) => {
    await c.wait(i * 160);
    await c.fly(blob, t, { html: `<span class="env">${ic('send')}</span>`, ms: 560, arc: 26 });
    t.dataset.s = 'wait';
    c.anim(t, [{ transform: 'translateY(0)' }, { transform: 'translateY(-5px)', offset: .4 }, { transform: 'none' }], { duration: 380, fill: 'none' }).catch(() => {});
  }));
  c.state('wait');
  say('Awaiting approvals');
  await c.wait(700);
  /* the spotlight turns to each operator in turn */
  for (const [i, t] of cards.entries()) {
    say(`Checking with ${TELCOS[i].name}`);
    await light.to(t);
    c.focus(t, 6);
    t.classList.add('polling');
    await c.tween(1000, e => { t.querySelector('.tbar i').style.transform = `scaleX(${e})`; }, ease.io);
    t.classList.remove('polling');
    /* approval: the card flips and comes back approved */
    await c.anim(t, [{ transform: 'none' }, { transform: 'perspective(500px) rotateY(90deg)' }], { duration: 170, easing: EASE_IN });
    t.dataset.s = 'done';
    await c.anim(t, [{ transform: 'perspective(500px) rotateY(-90deg)' }, { transform: 'none' }], { duration: 300 });
    t.getAnimations().forEach(x => x.cancel());
    c.ripple(t, 'var(--green)', { scaleTo: 1.1 });
    c.kick();
    await c.wait(160);
  }
  light.off();
  c.unfocus();
  await c.wait(400);
}

/* scene swap between stages inside one run */
async function kvSwap(c, html) {
  c.unfocus();
  await c.anim(el.scene, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.985)' }], { duration: 280, easing: EASE_IN, fill: 'forwards' });
  c.clearFx();
  el.scene.innerHTML = html;
  Blobs.mount(el.scene);
  await c.anim(el.scene, [{ opacity: 0, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 420, fill: 'none' });
  el.scene.getAnimations().forEach(a => a.cancel());
}

/* 6 · Brand Map — the agent first analyses its sources in the centre, then
   rises to the top with the sources in a row and builds brand boards live:
   brand headers resolve out of placeholders, lines of business drop into each
   brand's column. Hierarchy without trees, circles, or counts. */
addScene((() => {
  const BX = 300, BY = 52, CX = 300, CY = 180;   /* final (top) and opening (centre) blob positions */
  const ringPos = k => { const a = (210 + k * 60) * Math.PI / 180; return { x: CX + Math.cos(a) * 140, y: CY + Math.sin(a) * 112 }; };
  const SRC = [['globe', 70], ['chart', 128], ['grid', 186], ['file', 414], ['signal', 472], ['bag', 530]];
  const BR = [
    { c: 'var(--blue-3)', icon: 'layers', lobs: [62, 48, 70] },
    { c: 'var(--blue)', icon: 'bag', lobs: [56, 72, 44, 60] },
    { c: 'var(--blue-2)', icon: 'shield', lobs: [66, 52, 58] },
  ];
  const COLX = [24, 218, 412], COLW = 164, COLY = 100;
  return {
    id: 'brand', tab: 'Brand Map',
    title: 'Mapping your organization', doneTitle: 'Organization mapped', doneStep: 'Brands and lines of business are ready',
    steps: ['Scanning public sources', 'Identifying brands', 'Mapping lines of business', 'Refining suggestions'],
    html: () => `
      <svg class="bring" id="bRing" viewBox="0 0 600 360" aria-hidden="true"><ellipse class="trk" cx="${CX}" cy="${CY}" rx="140" ry="112"/><ellipse class="hl" id="bArc" cx="${CX}" cy="${CY}" rx="140" ry="112" pathLength="100"/></svg>
      <svg class="cone" id="vCone" viewBox="0 0 600 360" aria-hidden="true"><defs><linearGradient id="vConeG" gradientUnits="userSpaceOnUse"><stop offset="0" class="s0"/><stop offset=".3" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><polygon id="vConeP" points="0,0 0,0 0,0" fill="url(#vConeG)"/></svg>
      ${SRC.map(([i], k) => { const p = ringPos(k); return nd(i, p.x, p.y, { s: 40, k: `s${k}`, ring: true, cls: 'bsrc' }); }).join('')}
      ${core(CX, CY, 96)}
      ${BR.map((b, i) => `
        <div class="bcol" data-b="${i}" style="left:${COLX[i]}px;top:${COLY}px;width:${COLW}px;--c:${b.c}">
          <div class="bhead">
            <span class="blogo">${ic(b.icon)}</span>
            <span class="ls">${sk(70, 't')}${sk(42)}</span>
          </div>
          <div class="blobs-list"></div>
          <span class="bsweep"></span>
        </div>`).join('')}`,
    async run(c) {
      const blob = c.$('#core'), srcs = c.$$('.bsrc'), cols = c.$$('.bcol');

      /* 1 · the agent analyses each source from the centre */
      c.step(0); c.state('think');
      c.focus(blob, 4);
      await c.wait(400);
      const light = kvBeam(c), arc = c.$('#bArc');
      c.$('#bRing').classList.add('on');
      for (const [k, s] of srcs.entries()) {
        /* the arc on the track glides under the focused source; the beam lights it */
        if (k === 0) arc.style.transition = 'none';
        arc.style.strokeDashoffset = -((210 + k * 60) / 3.6 - 5);
        if (k === 0) { arc.getBoundingClientRect(); arc.style.transition = ''; }
        arc.classList.add('on');
        await light.to(s, 420);
        s.dataset.s = 'run';
        c.focus(s, 8);
        c.ring(s, 700).catch(() => {});
        await c.wait(300);
        for (let k = 0; k < 2; k++) {
          c.fly(s, blob, { html: '<span class="kfrag-f" style="--c:var(--blue)"></span>', ms: 460, scaleTo: .5, arc: 10 + k * 8 }).then(() => c.kick()).catch(() => {});
          await c.wait(170);
        }
        await c.wait(260);
        s.dataset.s = 'done';
      }
      light.off();
      c.$('#bRing').classList.remove('on');
      c.focus(blob, 4);
      c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
      await c.wait(600);

      /* the blob rises to the top and the sources settle into a row */
      c.state('tool'); c.unfocus();
      const glide = (n, x, y, w) => {
        n.style.transition = 'left 900ms var(--ease-io), top 900ms var(--ease-io), width 900ms var(--ease-io), height 900ms var(--ease-io), opacity 600ms var(--ease), transform 600ms var(--ease)';
        n.style.left = `${x - w / 2}px`; n.style.top = `${y - w / 2}px`;
        n.style.width = `${w}px`; n.style.height = `${w}px`;
      };
      glide(blob, BX, BY, 76);
      srcs.forEach((s, k) => setTimeout(() => !c.signal.aborted && glide(s, SRC[k][1], BY, 34), k * 50));
      await c.wait(1100);
      Blobs.mount(el.scene);
      srcs.forEach(s => s.classList.add('dim'));
      c.focus(blob, 4);

      /* 2 · brand columns appear as placeholders, then resolve */
      c.step(1); c.state('think');
      cols.forEach((col, i) => setTimeout(() => !c.signal.aborted && col.classList.add('ghost'), i * 120));
      await c.wait(900);
      for (const col of cols) {
        c.focus(col.querySelector('.bhead'), 4);
        await c.fly(blob, col.querySelector('.bhead'), { html: `<span class="bdrop" style="--c:${col.style.getPropertyValue('--c')}"></span>`, ms: 520, scaleTo: 1.4, arc: 12 });
        col.classList.remove('ghost'); col.classList.add('found');
        c.ripple(col.querySelector('.bhead'), 'var(--blue)', { scaleTo: 1.06 });
        c.kick();
        await c.wait(200);
      }

      /* 3 · lines of business drop into each brand's column */
      c.step(2); c.state('tool');
      for (const [i, b] of BR.entries()) {
        const list = cols[i].querySelector('.blobs-list');
        c.focus(cols[i], 4);
        for (const w of b.lobs) {
          list.insertAdjacentHTML('beforeend', `<div class="blob-pill pre">${sk(w)}</div>`);
          const pill = list.lastElementChild;
          await c.fly(blob, pill, { html: `<span class="bdrop sm" style="--c:${b.c}"></span>`, ms: 440, scaleTo: 1.2, arc: 10 });
          pill.classList.remove('pre');
          c.kick();
          await c.wait(90);
        }
        await c.wait(160);
      }

      /* 4 · refine: a pass over each board, one suggestion reorders itself */
      c.step(3); c.state('verify');
      for (const col of cols) {
        c.focus(col, 4);
        col.classList.add('sweep');
        await c.wait(520);
        col.classList.remove('sweep');
      }
      const list = cols[1].querySelector('.blobs-list'), pills = $$('.blob-pill', list);
      const mover = pills[2], above = pills[1];
      c.focus(mover, 4);
      const r0 = rectIn(mover), r1 = rectIn(above);
      mover.classList.add('lift');
      await c.wait(260);
      list.insertBefore(mover, above);
      const n0 = rectIn(mover), n1 = rectIn(above);
      c.anim(mover, [{ transform: `translateY(${r0.y - n0.y}px) scale(1.03)` }, { transform: 'scale(1.03)' }], { duration: 420, easing: EASE_IO, fill: 'none' }).catch(() => {});
      await c.anim(above, [{ transform: `translateY(${r1.y - n1.y}px)` }, { transform: 'none' }], { duration: 420, easing: EASE_IO, fill: 'none' });
      mover.classList.remove('lift');
      c.ripple(mover, 'var(--blue)', { scaleTo: 1.05 });
      await c.wait(700);
    },
  };
})());

<script>
/* ==========================================================================
   7 · Migration — the full run, plus one loader per backend step.
   Step loaders loop until the backend reports the next step.
   ========================================================================== */
const MIG_STEPS = ['Validating data integrity', 'Checking for duplicates', 'Categorising detected errors', 'Generating AI suggestions'];
const cellsHTML = (widths) => widths.map((w, j) => `<span class="cl" data-c="${j}"><span class="o" style="width:${w}px"></span><span class="n" style="width:${Math.round(w * .9)}px"></span><span class="spk" style="left:${w + 4}px">${ic('spark')}</span></span>`).join('');

const migAll = (() => {
  const ROWS = [[48, 62, 34, 28], [58, 52, 38, 34], [44, 68, 32, 26], [52, 58, 40, 30], [60, 50, 34, 36], [44, 68, 32, 26], [50, 60, 38, 32]];
  const FLAGS = [{ r: 1, c: 0, b: 1 }, { r: 3, c: 2, b: 1 }, { r: 6, c: 3, b: 1 }];
  const DUP = [2, 5];
  const BINS = [{ icon: 'copy', c: 'var(--blue)' }, { icon: 'alert', c: 'var(--rose)' }, { icon: 'spark', c: 'var(--green)' }];
  const RH = 36, BX = 410, BY = 180;
  return {
    id: 'migval', sub: 'All steps',
    title: 'Validating your data', doneTitle: 'Data validated', doneStep: 'Suggestions applied, originals kept',
    steps: MIG_STEPS,
    html: () => `
      <div class="card tbl" id="cT" style="left:26px;top:30px;width:330px;height:300px">
        <div class="tscan" id="cScan"></div>
        <div class="trow head" style="top:0"><span class="num" style="opacity:0"></span>${[44, 50, 38, 32].map(w => sk(w)).join('')}</div>
        ${ROWS.map((r, i) => `<div class="trow" data-r="${i}" style="top:${RH + i * RH}px"><span class="num"></span>${cellsHTML(r)}</div>`).join('')}
        <span class="gloss" id="cGloss"></span>
      </div>
      ${core(BX, BY, 76)}
      ${BINS.map((b, i) => `<div class="bin" data-b="${i}" style="left:470px;top:${80 + i * 70}px;width:108px;--c:${b.c}"><span class="bi">${ic(b.icon)}</span><span class="meter"><i></i><i></i><i></i></span></div>`).join('')}`,
    async run(c) {
      const T = c.$('#cT'), scan = c.$('#cScan'), blob = c.$('#core');
      const row = r => c.$(`.trow[data-r="${r}"]`), cell = (r, k) => c.$(`.trow[data-r="${r}"] .cl[data-c="${k}"]`);
      const ray = c.linePts({ x: BX - 40, y: BY }, { x: 356, y: BY }, { cls: 'hot' });
      ray.style.strokeDasharray = ''; ray.style.strokeDashoffset = ''; ray.style.opacity = 0;
      c.step(0); c.state('tool');
      c.focus(T, 6);
      const seen = new Set();
      scan.style.opacity = 1; ray.style.opacity = 1;
      await c.tween(2400, e => {
        const y = e * RH * ROWS.length + RH - 40;
        scan.style.transform = `translateY(${y}px)`;
        ray.setAttribute('d', `M${BX - 40},${BY} L356,${30 + y + 40}`);
        const idx = Math.floor(e * ROWS.length);
        for (let i = 0; i <= Math.min(idx, ROWS.length - 1); i++) {
          if (seen.has(i)) continue;
          seen.add(i);
          FLAGS.filter(f => f.r === i).forEach(f => { cell(f.r, f.c).classList.add('flag'); c.ripple(cell(f.r, f.c), 'var(--rose)', { scaleTo: 1.6, round: '4px' }); c.kick(); });
          if (i === DUP[1]) DUP.forEach(d => row(d).classList.add('dup'));
        }
      }, ease.io);
      await c.anim(scan, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
      scan.style.opacity = 0; ray.remove();

      c.step(1); c.state('think');
      const link = c.linePts({ x: 34, y: 30 + RH * (DUP[0] + 1.5) }, { x: 34, y: 30 + RH * (DUP[1] + 1.5) }, { cls: 'hot', bend: -24 });
      c.focus(row(DUP[0]), 2);
      await c.draw(link, 500);
      await c.packet(link, 520, { color: 'var(--blue)' });
      c.focus(row(DUP[1]), 2);
      await c.wait(300);
      await c.anim(row(DUP[1]), [{ transform: 'none', opacity: 1 }, { transform: `translateY(${-(DUP[1] - DUP[0]) * RH}px)`, opacity: 0 }], { duration: 600, easing: EASE_IO });
      link.remove();
      row(DUP[1]).remove();
      for (let i = DUP[1] + 1; i < ROWS.length; i++) {
        const r = row(i);
        r.style.top = `${RH + (i - 1) * RH}px`;
        if (!RM) r.animate([{ transform: `translateY(${RH}px)` }, { transform: 'none' }], { duration: 460, easing: EASE });
      }
      row(DUP[0]).classList.remove('dup'); row(DUP[0]).classList.add('merged');
      c.focus(row(DUP[0]), 2);
      await c.wait(700);

      /* categorise: every finding passes through the blob into its bin */
      c.step(2); c.state('tool');
      c.focus(blob, 4);
      const route = async (b, srcEl) => {
        const bin = c.$(`.bin[data-b="${b}"]`);
        await c.fly(srcEl, blob, { html: `<span class="dotc" style="--c:var(--muted)"></span>`, ms: 460 });
        c.kick();
        await c.fly(blob, bin, { html: `<span class="dotc" style="--c:${BINS[b].c}"></span>`, ms: 420 });
        const slot = bin.querySelector('.meter i:not(.on)'); if (slot) slot.classList.add('on');
        c.ripple(bin, BINS[b].c, { scaleTo: 1.06 });
        c.flash(bin);
      };
      await route(0, row(DUP[0]).querySelector('.num'));
      for (const f of FLAGS) await route(f.b, cell(f.r, f.c));
      await c.wait(300);

      /* suggest: the blob drafts each fix and sends it back to the cell */
      c.step(3);
      for (const f of FLAGS) {
        const ce = cell(f.r, f.c);

/* 7.1 · integrity — the blob casts a scan ray across every row */
const migIntegrity = {

/* ==========================================================================
   8 · Consent — the full run, plus one loader per backend step
   ========================================================================== */
const CON_STEPS = ['Preparing validated records', 'Checking consent signals', 'Verifying each record', 'Preparing your results'];
const SEG = [{ k: 'ok', c: 'var(--green)', p: 86 }, { k: 'exp', c: 'var(--amber)', p: 7 }, { k: 'rev', c: 'var(--rose)', p: 4 }, { k: 'mis', c: 'var(--faint)', p: 3 }];
const donutHTML = (x, y, s, id = 'vDonut') => `
  <div class="donut" id="${id}" style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px">
    <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="48"/>${SEG.map(g => `<circle class="sg" data-k="${g.k}" cx="60" cy="60" r="48" pathLength="100" style="stroke:${g.c}"/>`).join('')}</svg>
    <span class="mid">${ic('pie')}</span>
  </div>`;
const paintDonut = (root, counts) => {
  const tot = Object.values(counts).reduce((a, b) => a + b, 0);
  if (!tot) { $$('.sg', root).forEach(s => { s.style.strokeDasharray = '0 100'; }); return; }
  let off = 0;
  SEG.forEach(g => {
    const len = counts[g.k] / tot * 100, gap = len > 1.5 ? 1 : 0;
    const sg = $(`.sg[data-k="${g.k}"]`, root);
    sg.style.strokeDasharray = `${Math.max(0, len - gap)} ${100 - len + gap}`;
    sg.style.strokeDashoffset = -off;
    off += len;
  });
};
const tokenCard = () => `<span class="av">${ic('user')}</span><span class="ls">${sk(rnd(50, 76))}${sk(rnd(28, 48))}</span>`;
const gateHTML = (x, y, w, h) => `

    <div class="gate-cur" id="vCur"><span class="av">${ic('user')}</span><span class="ls">${sk(44)}${sk(30)}</span><span class="vchip" id="vChip"></span></div>
    ${['fileCheck', 'clock', 'target'].map((g, i) => `<div class="gchk" data-g="${i}"><span class="gi">${ic(g)}</span><span class="ls">${sk([52, 62, 46][i])}</span><span class="st"></span></div>`).join('')}
    <div class="batch" id="vBatch"><div class="workers" id="vW">${'<i></i>'.repeat(40)}</div>${sk(96)}</div>
  </div>`;
const VC = { ok: ['var(--green)', 'check'], exp: ['var(--amber)', 'clock'], rev: ['var(--rose)', 'x'] };
/* a record leaves the stream, is read by the blob, then passes the gates */
async function gatePass(c, stream, place, r, pal = VC) {
  const cur = c.$('#vCur'), chip = c.$('#vChip'), blob = c.$('#core');
  const card = pickRecord(stream);
  cur.classList.add('out'); chip.classList.remove('on');
  c.$$('.gchk').forEach(g => { delete g.dataset.s; g.querySelector('.st').innerHTML = ''; });
  card.classList.add('picked'); setTimeout(() => card.classList.remove('picked'), 600);
  await c.fly(card, blob, { ms: r.fast ? 380 : 480, scaleTo: .3, arc: 6 });
  c.kick();

  for (let g = 0; g < r.res.length; g++) {
    const row = c.$(`.gchk[data-g="${g}"]`);

    if (r.res[g] !== 'ok') c.ripple(row, r.res[g] === 'warn' ? 'var(--amber)' : 'var(--rose)', { scaleTo: 1.05 });
  }

  chip.offsetWidth; chip.classList.add('on');
  c.ripple(cur, pal[r.v][0], { scaleTo: 1.05 });
  await c.wait(r.fast ? 260 : 420);

}
/* verify-stage buckets: calm blues, the icon tells them apart */
const TRAY = { ok: ['var(--blue-3)', 'check'], exp: ['var(--blue)', 'clock'], rev: ['var(--blue-2)', 'x'] };

  async run(c) {

const conRecords = {
  id: 'con1', sub: 'Records', single: true, stepIndex: 0,
  title: 'Preparing validated records', msgs: ['Preparing validated records', 'Collecting records', 'Packaging for verification'],
  html: () => `
    ${nd('database', 58, 180, { s: 52, k: 'src', ring: true })}
    ${core(206, 180, 96)}
    <div class="deck" id="dDeck" style="left:310px;top:150px"></div>
    ${nd('fileCheck', 548, 180, { s: 52, k: 'dst', ring: true })}`,
  async run(c) {
    const src = c.$('.nd[data-k="src"]'), dst = c.$('.nd[data-k="dst"]'), deck = c.$('#dDeck'), blob = c.$('#core');
    const w1 = c.linePts({ x: 92, y: 180 }, { x: 150, y: 180 }), w2 = c.linePts({ x: 262, y: 180 }, { x: 302, y: 180 }), w3 = c.linePts({ x: 476, y: 180 }, { x: 514, y: 180 });
    await Promise.all([c.draw(w1, 400), c.draw(w2, 400), c.draw(w3, 400)]);
    while (true) {
      c.cycle();
      deck.innerHTML = ''; deck.classList.remove('ok'); deck.style.opacity = 1;
      c.state('tool'); src.dataset.s = 'run';
      for (let i = 0; i < 5; i++) {
        c.glance(center(rectIn(src)));
        c.ring(src, 600).catch(() => {});
        await c.fly(src, blob, { html: `<div class="tokn" style="width:120px;height:44px">${tokenCard()}</div>`, ms: 520, scaleFrom: .3, scaleTo: .3, arc: 10 });
        c.kick();
        c.packet(w2, 300).catch(() => {});
        await c.fly(blob, deck, { html: `<div class="tokn" style="width:150px;height:60px">${tokenCard()}</div>`, ms: 480, scaleFrom: .3, scaleTo: 1, arc: 8, fade: false });
        $$('.layer', deck).forEach((L, k, arr) => { L.style.transform = `translate(${(arr.length - k) * 4}px, ${(arr.length - k) * 4}px)`; L.style.zIndex = k; L.classList.remove('top'); L.innerHTML = ''; });
        const L = document.createElement('div');
        L.className = 'layer top'; L.style.zIndex = 10; L.innerHTML = tokenCard();
        deck.appendChild(L);
        c.focus(deck, 8);
      }
      src.dataset.s = 'idle';
      c.state('verify');
      if (!deck.querySelector('.tick')) deck.insertAdjacentHTML('beforeend', `<span class="tick">${ic('check')}</span>`);
      deck.classList.add('ok');
      c.ripple(deck, 'var(--green)', { scaleTo: 1.2, round: '12px' });
      await c.wait(700);
      c.packet(w3, 420, { color: 'var(--green)' }).catch(() => {});
      await c.anim(deck, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(150px) scale(.35)', opacity: 0 }], { duration: 620, easing: EASE_IO });
      deck.getAnimations().forEach(a => a.cancel()); deck.style.opacity = 0;
      dst.dataset.s = 'done';
      c.ripple(dst);
      await c.wait(700);
      dst.dataset.s = 'idle';
    }
  },
};

/* 8.2 · signals — the blob reads a record and polls four signal sources */
const conSignals = {
  id: 'con2', sub: 'Signals', single: true, stepIndex: 1,
  title: 'Checking consent signals', msgs: ['Checking consent signals', 'Querying opt-in history', 'Matching purpose'],
  html: () => `
    ${core(300, 156, 104)}
    <div class="gate-cur" id="gRec" style="position:absolute;left:226px;top:262px;width:148px;background:var(--surface);box-shadow:var(--shadow-2);z-index:3"><span class="av">${ic('user')}</span><span class="ls">${sk(56)}${sk(36)}</span><span class="vchip" id="gChip"></span></div>
    ${[['fileCheck', 110, 72], ['clock', 490, 72], ['target', 110, 260], ['shield', 490, 260]].map(([i, x, y], k) => nd(i, x, y, { s: 50, k, ring: true })).join('')}`,
  async run(c) {
    const rec = c.$('#gRec'), chip = c.$('#gChip'), nodes = c.$$('.nd'), blob = c.$('#core');
    const feed = c.line(rec, blob, { ta: 28, tb: 58 });
    const lines = nodes.map((n, k) => c.line(blob, n, { ta: 58, tb: 36, bend: k % 3 ? 14 : -14 }));
    await Promise.all([feed, ...lines].map(l => c.draw(l, 500)));
    while (true) {
      c.cycle();
      c.state('think'); c.focus(rec, 6);
      await c.packet(feed, 420);
      c.ripple(blob, 'var(--blue)', { scaleTo: 1.4 });
      c.state('tool'); c.focus(blob, 4);
      const warnAt = Math.random() < .5 ? Math.floor(rnd(0, 4)) : -1;
      await Promise.all(nodes.map(async (n, k) => {
        await c.wait(k * 120);
        await c.packet(lines[k], 460);
        n.dataset.s = 'run';
        await c.ring(n, rnd(700, 1300));
        const warn = k === warnAt;
        n.dataset.s = warn ? 'warn' : 'done';
        if (warn) n.querySelector('.badge').innerHTML = ic('<path d="M12 7v6M12 17h.01"/>');
        c.ripple(n, warn ? 'var(--amber)' : 'var(--green)');
        await c.packet(lines[k], 420, { reverse: true, color: warn ? 'var(--amber)' : 'var(--green)' });
        c.kick();
      }));
      c.state('verify');
      const v = warnAt >= 0 ? 'exp' : 'ok';
      await c.packet(feed, 400, { reverse: true, color: VC[v][0] });
      chip.style.background = VC[v][0]; chip.innerHTML = ic(VC[v][1]);
      chip.offsetWidth; chip.classList.add('on');
      c.ripple(rec, VC[v][0], { scaleTo: 1.12 });
      await c.wait(1100);
      chip.classList.remove('on');
      nodes.forEach(n => { n.dataset.s = 'idle'; n.querySelector('.nd-ring .p').style.strokeDashoffset = 100; n.querySelector('.badge').innerHTML = ic('check'); });
      await c.anim(rec, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(8px)', opacity: 0 }], { duration: 220, easing: EASE_IN });
      await c.anim(rec, [{ transform: 'translateY(-8px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320 });
    }
  },
};

/* 8.3 · verify — records stream through the blob and the gates into trays */
const conVerify = {
  id: 'con3', sub: 'Verify', single: true, endless: true, stepIndex: 2,
  title: 'Verifying each record', msgs: ['Verifying each record', 'Checking retention windows', 'Confirming purpose'],
  html: () => `
    ${streamHTML()}
    ${core(214, 180, 72)}
    ${gateHTML(266, 40, 176, 280)}
    ${Object.entries(TRAY).map(([k, [col, i]], j) => `<div class="tray" data-k="${k}" style="left:462px;top:${96 + j * 60}px;width:112px;--c:${col}"><span class="ti">${ic(i)}</span><span class="pile"></span></div>`).join('')}`,
  async run(c) {
    const stream = c.$('#vStream'), place = () => {};
    await c.wait(600);
    c.state('verify'); c.focus(c.$('#vGate'), 4);
    let n = 0;
    while (true) {
      c.cycle();
      const roll = Math.random();
      const r = roll < .7 ? { v: 'ok', res: ['ok', 'ok', 'ok'] } : roll < .85 ? { v: 'exp', res: ['ok', 'warn'] } : { v: 'rev', res: ['fail'] };
      r.fast = n++ > 1;
      const chip = await gatePass(c, stream, place, r, TRAY);
      const tray = c.$(`.tray[data-k="${r.v}"]`);
      await c.fly(chip, tray, { ms: 520, scaleTo: .6 });
      const pile = tray.querySelector('.pile');
      pile.insertAdjacentHTML('beforeend', '<i></i>');
      while (pile.children.length > 8) pile.firstElementChild.remove();
      c.ripple(tray, TRAY[r.v][0], { scaleTo: 1.06 });
      c.flash(tray);
    }
  },
};

/* 8.4 · results — the blob composes a report section by section, then seals it */
const conResults = {
  id: 'con4', sub: 'Results', single: true, stepIndex: 3,
  title: 'Preparing your results', msgs: ['Preparing your results', 'Summarising outcomes', 'Signing the report'],
  html: () => `
    ${core(86, 180, 100)}
    <div class="card" id="rCard" style="left:176px;top:34px;width:350px;height:292px;padding:22px;overflow:visible">
      <div class="card-h"><span class="hic">${ic('chart')}</span><span class="lines">${sk(130, 't')}${sk(80)}</span></div>
      <div style="display:flex;align-items:center;gap:28px;margin-top:6px">
        <div style="position:relative;width:110px;height:110px">${donutHTML(0, 0, 110, 'rDonut')}</div>
        <div class="bars" id="rBars">${['var(--blue-3)', 'var(--blue)', 'var(--blue-5)', 'var(--blue-2)', 'var(--blue-4)'].map(col => `<i style="--c:${col};height:${Math.round(rnd(40, 90))}px"></i>`).join('')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:22px">${[250, 210, 170].map(w => `<span class="sk rline" style="width:${w}px"></span>`).join('')}</div>
      <span class="gloss" id="rGloss"></span>
    </div>
    <span class="stamp" id="rStamp" style="left:496px;top:14px">${ic('shieldCheck')}</span>`,
  async run(c) {
    const card = c.$('#rCard'), donut = c.$('#rDonut'), bars = c.$$('#rBars i'), lines = c.$$('.rline'), stamp = c.$('#rStamp'), blob = c.$('#core');
    const feed = async target => {
      const l = c.line(blob, target, { ta: 54, tb: 6, bend: 14 });
      await c.draw(l, 260);
      c.kick();
      await c.packet(l, 380);
      c.anim(l, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).then(() => l.remove()).catch(() => {});
    };
    while (true) {
      c.cycle();
      c.state('tool');
      await feed(donut);
      c.focus(donut, 8);
      const counts = { ok: 0, exp: 0, rev: 0, mis: 0 };
      await c.tween(1200, e => { SEG.forEach(s => { counts[s.k] = s.p * e; }); counts.ok += .0001; paintDonut(donut, counts); }, ease.io);
      c.ripple(donut, 'var(--green)', { scaleTo: 1.15, round: '50%' });
      await feed(c.$('#rBars'));
      c.focus(c.$('#rBars'), 8);
      for (const b of bars) { b.style.height = `${Math.round(rnd(40, 90))}px`; b.style.transform = 'scaleY(1)'; await c.wait(110); }
      await c.wait(300);
      c.state('think');
      for (const l of lines) { await feed(l); c.focus(l, 6); l.classList.add('on'); await c.wait(160); }
      c.state('verify');
      c.unfocus();
      stamp.classList.add('on');
      c.ripple(stamp, 'var(--green)', { scaleTo: 1.8, round: '50%' });
      card.querySelector('#rGloss').classList.remove('go'); card.offsetWidth; card.querySelector('#rGloss').classList.add('go');
      await c.wait(1800);
      stamp.classList.remove('on');
      bars.forEach(b => { b.style.transform = ''; });
      lines.forEach(l => l.classList.remove('on'));
      paintDonut(donut, { ok: 0, exp: 0, rev: 0, mis: 0 });
      await c.wait(700);
    }
  },
};
addGroup('consent', 'Consent', [conAll, conRecords, conSignals, conVerify, conResults]);

boot();
</script>
</body>
</html>
