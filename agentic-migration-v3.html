<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Migration v3 — WiselyConsent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css">
<style>
:root{
  --ink:#10213b; --ink-2:#3d4a63; --ink-3:#5c6781; --ink-4:#8590a8; --muted:#64728c;
  --bg:#f5f6fb; --bg-2:#eef1f7; --card:#fff;
  --line:#e2e8f2; --line-2:#eef1f6;
  --blue:#2560f6; --blue-d:#154ace; --blue-soft:#edf3ff; --blue-border:#cddcff;
  --green:#118252; --green-soft:#eaf7f0;
  --amber:#935e13; --amber-soft:#fff6e6;
  --red:#b73c4a;
  --sidebar:220px; --upload:320px;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --font:'Geist',Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --sh:0 4px 22px #14294408;
  --sh-2:0 8px 28px rgba(20,41,68,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-header{padding:16px 14px;border-bottom:1px solid var(--line)}
.sidebar-logo{height:28px;width:140px;object-fit:contain}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-lbl{padding:8px 10px 4px;font-size:11px;font-weight:650;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none}
.nav-item.active{background:var(--blue-soft);color:var(--blue-d);font-weight:650}
.nav-item.is-muted{opacity:.4;pointer-events:none}
.sidebar-user{padding:14px;border-top:1px solid var(--line);font-size:13px}
.sidebar-user b{display:block}.sidebar-user span{color:var(--ink-4);font-size:11.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.workspace{flex:1;display:grid;grid-template-columns:var(--upload) minmax(0,1fr);min-height:0}
.upload-rail{border-right:1px solid var(--line);background:var(--card);padding:22px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.upload-rail h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.upload-rail .lead{font-size:12.5px;color:var(--muted);line-height:1.5}
.secure{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:var(--blue-soft);border:1px solid var(--blue-border);font-size:11px;font-weight:600;color:var(--blue-d)}
.secure svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.field label{display:block;font-size:11px;font-weight:650;color:var(--ink-3);margin-bottom:5px}
.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fcfdff}
.upload-rail{background:linear-gradient(180deg,#fff 0%,#fff 55%,#f6fbfa 100%)}
.upload-rail::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#0f766e,#2bb39f)}
.drop{position:relative;--t:15 118 110;--fill:0%;border:1.5px dashed #a9d6cc;border-radius:14px;background:radial-gradient(120% 90% at 50% 0%,#f8fcfb 0%,#eaf5f2 100%);padding:14px 14px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:border-color .18s var(--ease),box-shadow .18s}
.drop:hover{border-color:#7cc2b4}
.drop.is-drag{--fill:55%;border-color:#0f766e;border-style:solid;box-shadow:0 0 0 4px rgba(15,118,110,.08)}
.drop.is-picked{--fill:100%;border-style:solid;border-color:#9fd2c6}
.enc-badge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 8px;border-radius:999px;background:#fff;border:1px solid #b5dfd6;color:#0f766e;font-size:10.5px;font-weight:650;box-shadow:0 1px 2px rgba(15,118,110,.08)}
.enc-badge>svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.enc-info{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#4f9d91;cursor:help}
.enc-info:hover,.enc-info:focus-visible{color:#0f766e;background:#ecf7f4}
.enc-info svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.drop-art{height:150px;width:100%;display:grid;place-items:center}
.drop .paper{scale:.82;margin:-11px 0}
.drop:hover .paper,.drop.is-drag .paper{transform:translateY(-3px)}
.drop:hover .paper .back:not(.b2),.drop.is-drag .paper .back:not(.b2){transform:translate(12px,4px) rotate(6.5deg)}
.paper .back.b2{transform:translate(-9px,7px) rotate(-4deg);opacity:0;transition:opacity .3s,transform .35s var(--ease)}
.drop.multi .paper .back.b2{opacity:1}
.drop.is-drag .scan{opacity:1;animation:breathe 2.4s ease-in-out infinite}
.drop-plus{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;border:1px solid #b5dfd6;box-shadow:0 6px 14px rgba(15,118,110,.14);display:grid;place-items:center;color:#0f766e;transition:opacity .25s,transform .25s var(--ease)}
.drop-plus svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop.is-picked .drop-plus{opacity:0;transform:scale(.7)}
.drop.is-drag .drop-plus{transform:translateY(-4px)}
.drop-count{position:absolute;top:-10px;left:-18px;height:26px;padding:0 10px;border-radius:999px;background:#0f766e;color:#fff;font-size:13px;font-weight:650;display:grid;place-items:center;box-shadow:0 4px 10px rgba(15,118,110,.25);opacity:0;transform:scale(.7);transition:opacity .25s,transform .25s var(--ease)}
.drop.multi .drop-count{opacity:1;transform:none}
.drop b{font-size:13px;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-btns{display:flex;gap:4px;margin-top:4px}
.drop-lock{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:linear-gradient(180deg,#14988b,#0f766e);display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,118,110,.3);opacity:0;transform:scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.drop-lock svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop.sealed .drop-lock{opacity:1;transform:none}
.drop.sealing .scan{opacity:1;animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{from{top:6%}to{top:94%}}
/* sealed pages read as ciphertext: lines break into dots */
.drop.sealed .read .doc i{background:repeating-linear-gradient(90deg,rgb(var(--t)/.32) 0 3px,transparent 3px 6px)}
.drop.sealed .read .doc-img{background:repeating-linear-gradient(45deg,rgb(var(--t)/.14) 0 3px,transparent 3px 6px)}
.drop.sealed .read .doc-sig{opacity:.35}
#uploadBtn svg{width:14px;height:14px}
.af-row{display:flex;align-items:center;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.af-lbl{font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.info{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink-4);cursor:help}
.info svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.info:hover,.info:focus-visible{color:var(--blue)}
.switch{position:relative;width:34px;height:20px;flex-shrink:0;margin-left:auto}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;border-radius:999px;background:#d5dbe6;transition:background .2s}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,33,59,.25);transition:transform .2s var(--ease)}
.switch input:checked+.track{background:var(--blue)}
.switch input:checked+.track::after{transform:translateX(14px)}
.switch input:focus-visible+.track{outline:2px solid var(--blue);outline-offset:2px}
.picked-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.picked-list li{display:flex;align-items:center;gap:9px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;animation:enter .3s var(--ease)}
.picked-list .pi{position:relative;width:15px;height:19px;border-radius:3px;border:1px solid #dbe2ec;background:#fff;flex-shrink:0;box-shadow:0 1px 2px rgba(16,33,59,.06)}
.picked-list .pi::before{content:'';position:absolute;left:3px;right:3px;top:4px;height:8px;background:repeating-linear-gradient(180deg,#d5dce8 0 1.5px,transparent 1.5px 3.5px)}
.picked-list .pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.picked-list b{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked-list .st{font-size:10.5px;color:#0f766e;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked-list li.sealed .st{color:#0f766e}
.picked-list .pbar{height:2px;border-radius:2px;background:var(--bg-2);overflow:hidden}
.picked-list .pbar i{display:block;height:100%;width:40%;border-radius:inherit;background:#14988b;animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.picked-list li.sealed .pbar{display:none}
.picked-list .sz{color:var(--ink-4);font-size:11px;font-family:var(--mono);flex-shrink:0}
.picked-list .lk{position:absolute;right:-6px;bottom:-5px;width:13px;height:13px;border-radius:50%;background:#0f766e;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;opacity:0;transform:scale(.5);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.picked-list .lk svg{width:8px;height:8px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.picked-list li.sealed .lk{opacity:1;transform:none}
.picked-list button{width:24px;height:24px;border-radius:6px;color:var(--ink-4);display:grid;place-items:center;flex-shrink:0}
.picked-list button:hover{background:var(--bg-2);color:var(--ink)}
.picked-list button svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.drop b{font-size:13px;font-weight:650}
.drop p,.caption{font-size:11.5px;color:var(--ink-4);line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn:hover{border-color:#baccef;background:#f9fbff}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 3px #2560f620}
.btn-pri:hover{background:var(--blue-d)}
.btn-pri:disabled{background:#c6d3ea;border-color:#c6d3ea;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{height:32px;padding:0 11px;font-size:12px}
.btn-full{width:100%}
.btn-ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn-ghost:hover{background:var(--blue-soft)}
.declare,.toggle{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.declare input,.toggle input{margin-top:2px;accent-color:var(--blue)}
.more{border-top:1px solid var(--line);padding-top:10px}
.more summary{font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.error{padding:9px 11px;border-radius:9px;background:#fff0f2;color:var(--red);font-size:12px;font-weight:550}

/* Right stage */
.stage{padding:20px 22px 36px;min-width:0;display:flex;flex-direction:column;gap:14px}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filters,.layouts{display:inline-flex;padding:3px;background:var(--bg-2);border-radius:10px;gap:2px}
.chip-btn{height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.chip-btn.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,26,51,.06)}
.chip-btn .n{margin-left:3px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.chip-btn.is-on .n{color:var(--blue)}
.layouts .chip-btn{display:inline-flex;align-items:center;gap:6px}
.layouts .chip-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.stage-hint{font-size:12.5px;color:var(--muted)}
.stage-hint strong{color:var(--ink);font-weight:650}

/* Tint per state — every fill, line and glow reads from --t at low alpha */
.file-tile,.folder-card,.mini-tile{--t:100 116 139}
.file-tile.run,.folder-card.run,.mini-tile.run{--t:37 96 246}
.file-tile.attn,.folder-card.needs,.mini-tile.attn{--t:100 116 139}
.file-tile.ok,.folder-card.ok,.mini-tile.ok{--t:22 150 96}

/* Page grid — document tiles */
.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.file-tile{position:relative;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s}
.file-tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#d6e1f7}
.file-tile:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.file-tile.needs{border-color:#d9e3f5}
.file-tile.done{opacity:.94}
.tile-art,.folder-art{position:relative;height:212px;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#fcfdfe 0%,#f2f4f8 100%);border-bottom:1px solid var(--line-2);container-type:inline-size}

/* the page: a back sheet fanned out, a front sheet with real document structure */
.paper{position:relative;width:132px;height:172px;transition:transform .35s var(--ease)}
.paper .back{position:absolute;inset:0;border-radius:7px;background:#f6f7f9;border:1px solid #e7eaf0;transform:translate(9px,5px) rotate(4.5deg);box-shadow:0 8px 18px -8px rgba(16,33,59,.10);transition:transform .35s var(--ease)}
.paper .sheet{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,#fff,#fdfdfe);border:1px solid #e8ecf2;box-shadow:0 1px 2px rgba(16,33,59,.04),0 8px 18px -6px rgba(16,33,59,.09),0 22px 38px -18px rgba(16,33,59,.14)}
.file-tile:hover .paper{transform:translateY(-3px)}
.file-tile:hover .paper .back{transform:translate(12px,4px) rotate(6.5deg)}
.sheet-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.doc{position:absolute;inset:0;padding:14px 13px 12px;display:flex;flex-direction:column;gap:11px}
.doc i{display:block;height:4px;border-radius:2px;background:#e9edf3}
.doc-head{display:flex;gap:8px;align-items:center}
.doc-img{width:24px;height:24px;border-radius:5px;background:#eff2f6;flex-shrink:0}
.doc-hl{flex:1;display:flex;flex-direction:column;gap:5px}
.doc-hl i:first-child{height:5px;background:#e1e6ed}
.doc-p{display:flex;flex-direction:column;gap:6px}
.doc-sig{position:absolute;right:12px;bottom:10px;width:38px;height:22px;fill:none;stroke:#cdd3dd;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* the read layer: a clipped copy of the page, tinted, that grows down with --fill */
.read{position:absolute;inset:0;clip-path:inset(0 0 calc(100% - var(--fill,0%)) 0);transition:clip-path .9s var(--ease-out);background:linear-gradient(180deg,rgb(var(--t)/.015),rgb(var(--t)/.04))}
.read .doc i{background:rgb(var(--t)/.18)}
.read .doc-hl i:first-child{background:rgb(var(--t)/.26)}
.read .doc-img{background:rgb(var(--t)/.09)}
.read .doc-sig{stroke:rgb(var(--t)/.5)}
.trail{position:absolute;left:0;right:0;height:56px;top:calc(var(--fill,0%) - 56px);background:linear-gradient(180deg,rgb(var(--t)/0),rgb(var(--t)/.09));transition:top .9s var(--ease-out)}
.scan{position:absolute;left:-7px;right:-7px;top:var(--fill,0%);height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,rgb(var(--t)/0),rgb(var(--t)/.5) 18%,rgb(var(--t)/.62) 50%,rgb(var(--t)/.5) 82%,rgb(var(--t)/0));box-shadow:0 0 8px rgb(var(--t)/.22),0 0 18px rgb(var(--t)/.12);opacity:0;transition:top .9s var(--ease-out),opacity .3s}
.file-tile.run .scan,.file-tile.attn:not(.full) .scan{opacity:1}
.file-tile.run .scan{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
/* finished pages read as signed ink, not a coloured block */
.file-tile.ok .read .doc i,.file-tile.attn .read .doc i{background:#dfe4eb}
.file-tile.ok .read .doc-hl i:first-child,.file-tile.attn .read .doc-hl i:first-child{background:#d3d9e2}
.file-tile.ok .read .doc-img,.file-tile.attn .read .doc-img{background:#eceff4}
.file-tile.ok .read .doc-sig{stroke:#3d4a63}
.file-tile.ok .trail,.file-tile.attn .trail{opacity:0}
.file-tile.attn .read{background:none}
.doc-stamp{position:absolute;top:9px;right:9px;width:16px;height:16px;border-radius:50%;background:rgb(var(--t)/.12);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s var(--ease)}
.doc-stamp svg{width:10px;height:10px;fill:none;stroke:rgb(var(--t));stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.file-tile.ok .doc-stamp{opacity:1;transform:none}
.file-tile.attn .doc-stamp{opacity:1;transform:none;width:18px;height:18px;background:var(--amber-soft);box-shadow:0 0 0 1px #f0d9a8}
.file-tile.attn .doc-stamp svg{stroke:var(--amber)}

.tile-art{height:236px;padding-top:24px}
.tile-top{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;z-index:2}
.tile-top .tile-lob{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--ink-3);font-size:10.5px;font-weight:600}
.tile-art>.tile-pct{position:absolute;right:12px;bottom:10px;font-size:17px;letter-spacing:-.6px;z-index:2}
.tile-tip{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-foot .tile-row{min-height:32px}
.tile-foot .tile-row:first-child{min-height:0}
.tile-act{flex-shrink:0}
.tile-foot,.folder-foot{padding:11px 13px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tile-name{font-size:12.5px;font-weight:650;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-pct{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.3px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.run .tile-pct{color:var(--blue-d)}.attn .tile-pct,.needs .tile-pct{color:var(--ink-2)}.ok .tile-pct{color:var(--green)}
.tile-lob{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-stage{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:650;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;flex-shrink:0}
.tile-stage.run{background:var(--blue-soft);border-color:var(--blue-border);color:var(--blue-d)}
.tile-stage .pulse{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.7s var(--ease) infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
.tile-stage.attn{color:var(--amber);border-color:#f0d9a8;background:var(--amber-soft)}
.tile-stage.ok{color:var(--green);border-color:#b7e4c7;background:var(--green-soft)}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-80% 0}}

/* Folder view — grey folder, sheet peeking out, frosted front pocket */
.folder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.folder-card{position:relative;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.folder-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#d6e1f7}
.folder-card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.folder-card.needs{border-color:#d9e3f5}
.folder{position:relative;width:200px;height:150px;filter:drop-shadow(0 14px 16px rgba(16,33,59,.10)) drop-shadow(0 2px 3px rgba(16,33,59,.06));transition:transform .35s var(--ease)}
.folder>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.f-sheet{position:absolute;left:22px;right:22px;top:22px;height:100px;border-radius:6px;background:#fff;padding:11px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(16,33,59,.08);transition:transform .45s var(--ease)}
.f-sheet i{display:block;height:4px;border-radius:2px;background:#eceff3}
.f-sheet i:first-child{width:46%;background:#e2e6ec}.f-sheet i:nth-child(2){width:72%}.f-sheet i:nth-child(3){width:58%}
.f-sheet.s2{left:30px;right:14px;top:28px;background:#f6f7f9;transform:rotate(3deg)}
.folder-card:hover .f-sheet{transform:translateY(-7px)}
.folder-card:hover .f-sheet.s2{transform:translateY(-4px) rotate(4deg)}
.f-front{position:absolute;inset:0;clip-path:path('M8,56 Q8,46 18,46 H70 C77,46 79,58 88,58 H182 Q192,58 192,68 V130 Q192,142 180,142 H20 Q8,142 8,130 Z');background:linear-gradient(180deg,rgba(190,192,198,.78),rgba(168,170,177,.9));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.f-fill{position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:linear-gradient(0deg,rgb(var(--t)/.13),rgb(var(--t)/.04) 75%,rgb(var(--t)/0));transition:height .9s var(--ease-out)}
.folder-card.run .f-front::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);background-size:250% 100%;animation:sheen 3s var(--ease) infinite}
.f-edge path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1}
.f-label{position:absolute;left:20px;right:16px;bottom:17px;display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.f-hex{width:30px;height:32px;flex-shrink:0}
.f-logo{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(60,62,70,.2)}
.f-logo img{max-width:22px;max-height:22px;display:block}
.f-hex path{fill:rgba(110,112,120,.32);stroke:rgba(110,112,120,.32);stroke-width:3;stroke-linejoin:round}
.f-hex text{font:700 10.5px var(--font);fill:#fff;letter-spacing:-.2px}
.f-label>span{min-width:0;display:flex;flex-direction:column}
.f-label b{font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(60,62,70,.18)}
.f-label small{font-size:12px;opacity:.82;line-height:1.3}
.folder-foot{flex-direction:row;align-items:center;justify-content:space-between}
@container (max-width:230px){.paper{scale:.86}.folder{scale:.8}}

.drill{display:flex;flex-direction:column;gap:12px;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.drill-head{display:flex;align-items:center;gap:10px}
.drill-head h2{font-size:16px;font-weight:700;letter-spacing:-.3px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,transform .15s}
.file-row:hover{border-color:#cddcff;transform:translateX(2px)}
.mini-tile{position:relative;width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:#f4f6f9;display:grid;place-items:center}
.mini-sheet{position:relative;width:32px;height:42px;border-radius:3px;background:#fff;border:1px solid #e3e7ee;box-shadow:0 2px 6px rgba(16,33,59,.08);overflow:hidden}
.ml{position:absolute;inset:0;padding:6px 5px;display:flex;flex-direction:column;gap:4px}
.ml i{display:block;height:2.5px;border-radius:2px;background:#e6eaf0}
.read .ml i{background:rgb(var(--t)/.24)}
.file-row b{display:block;font-size:13px;font-weight:650}
.file-row span{font-size:11.5px;color:var(--ink-4)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:650;background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.run{background:var(--blue-soft);color:var(--blue-d);border-color:var(--blue-border)}
.pill.attn{background:var(--amber-soft);color:var(--amber);border-color:#f0d9a8}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:#b7e4c7}

.empty{padding:44px 20px 48px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.6)}
.empty-art{position:relative;width:92px;height:116px;margin:0 auto 22px}
.e-back{position:absolute;inset:0;border-radius:7px;background:#f3f5f9;border:1px solid #e6eaf0;transform:translate(9px,5px) rotate(5deg)}
.e-sheet{position:absolute;inset:0;border-radius:7px;background:#fff;border:1.5px dashed #cdd5e2;padding:16px 12px;display:flex;flex-direction:column;gap:9px;animation:efloat 4s ease-in-out infinite}
.e-sheet i{display:block;height:4px;border-radius:2px;background:#eef1f5}
.e-badge{position:absolute;right:-14px;bottom:-10px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-2);display:grid;place-items:center;color:var(--ink-4)}
.e-badge svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@keyframes efloat{50%{transform:translateY(-4px)}}
.empty h3{font-size:15px;font-weight:650;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);max-width:320px;margin:0 auto}

/* Drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(16,33,59,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.is-on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:50;box-shadow:var(--sh-2);transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column}
.drawer.is-on{transform:none}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-head p{font-size:12px;color:var(--ink-4);margin-top:4px}
.drawer-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.stat small{display:block;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4);margin-bottom:3px}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.step-focus{padding:14px;border-radius:12px;background:radial-gradient(120% 80% at 50% -20%,rgba(59,130,246,.1),transparent 60%),#fff;border:1px solid var(--blue-border)}
.step-focus .lbl{font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.step-focus b{font-size:15px;font-weight:700}
.step-focus p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.step-dots{display:flex;gap:5px;margin-top:12px}
.step-dots i{width:7px;height:7px;border-radius:50%;background:#dce3ef}
.step-dots i.on{background:var(--blue);box-shadow:0 0 0 3px rgba(37,96,246,.15)}
.step-dots i.done{background:#93c5fd}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){.page-grid,.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .workspace{grid-template-columns:1fr}
  .upload-rail{position:relative;top:0;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .page-grid,.folder-grid{grid-template-columns:1fr}
  .sidebar{display:none}
}

/* Live progress is painted every frame, so the fill layers must not ease behind it */
.file-tile.run .read,.file-tile.run .trail,.folder-card.run .f-fill{transition:none}
.file-tile.run .scan{transition:opacity .3s}

/* Focus mode — the opened file or folder takes the rail, its action takes the stage */
.rail-pane{display:flex;flex-direction:column;gap:14px}
#focusPane{animation:enter .35s var(--ease)}
.is-focus .stage-bar{display:none}
.stage-hint:empty{display:none}
.rail-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 -2px}
.back-btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .15s}
.back-btn:hover{background:var(--bg-2)}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link-btn{font-size:12px;font-weight:600;color:var(--blue);padding:4px 6px;border-radius:6px}
.link-btn:hover{background:var(--blue-soft)}
.focus-art{height:224px;border-radius:14px;border:1px solid var(--line-2);background:radial-gradient(120% 90% at 50% 0%,#fcfdfe 0%,#f2f4f8 100%);display:grid;place-items:center;flex-shrink:0}
.file-tile.focus-tile,.folder-card.focus-tile{border:0!important;background:none!important;box-shadow:none!important;overflow:visible;cursor:default;display:block;transform:none!important;border-radius:0;opacity:1}
.focus-id{display:flex;flex-direction:column;gap:8px}
.focus-id h2{font-size:17px;font-weight:700;letter-spacing:-.35px;line-height:1.25;overflow-wrap:anywhere}
.chip-lob{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-3);font-size:10.5px;font-weight:600;white-space:nowrap}
.sub-meta{font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);min-width:0}
.facts dt{font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4)}
.facts dd{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-lbl{font-size:11px;font-weight:650;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:-4px}
.rail-note{font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid #f0d9a8;border-radius:10px;padding:9px 11px;line-height:1.4}
.tl{list-style:none;display:flex;flex-direction:column}
.tl li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:11px;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:10px;top:25px;bottom:3px;width:2px;border-radius:2px;background:var(--line-2)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:#bfe6cf}
.tl .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}
.tl .dot svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tl .dot i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tl li.done .dot{background:var(--green-soft);border-color:#b7e4c7;color:var(--green)}
.tl li.now .dot{border-color:var(--blue-border);background:var(--blue-soft)}
.tl li.now .dot i{background:var(--blue);animation:pulse 1.7s var(--ease) infinite}
.tl li.wait .dot{border-color:#f0d9a8;background:var(--amber-soft)}
.tl li.wait .dot i{background:#d9a54a;animation:pulse 1.7s var(--ease) infinite}
.tl b{display:block;font-size:13px;font-weight:650;line-height:22px}
.tl li.todo b{color:var(--ink-4);font-weight:550}
.tl p{font-size:11.5px;color:var(--ink-4);line-height:1.4}
.tl li.now p{color:var(--blue-d)}.tl li.wait p{color:var(--amber)}
.tl time{font-family:var(--mono);font-size:11px;color:var(--ink-4);line-height:22px}
.mix{list-style:none;display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;padding:2px 12px}
.mix li{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:8px 0;border-top:1px dashed var(--line)}
.mix li:first-child{border-top:0}
.mix i{width:8px;height:8px;border-radius:50%}
.mix b{margin-left:auto;font-variant-numeric:tabular-nums}

/* Action panel */
.act{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:26px 28px;display:flex;flex-direction:column;gap:20px;max-width:780px;animation:enter .4s var(--ease)}
.act-eyebrow{align-self:flex-start}
.act h2{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.act .lead{font-size:13.5px;color:var(--muted);line-height:1.6;max-width:600px;margin-top:8px}
.act .lead b{color:var(--ink);font-weight:650}
.act-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act-stat{padding:14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.act-stat small{font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4)}
.act-stat b{font-size:21px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.act-stat span{font-size:11.5px;color:var(--ink-4)}
.act-sec h3{font-size:12px;font-weight:650;color:var(--ink-3);margin-bottom:9px}
.fix-table,.sum{border:1px solid var(--line-2);border-radius:12px}
.fix-row{display:grid;grid-template-columns:110px minmax(0,1fr) 18px minmax(0,1fr);gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2)}
.fix-row:first-child{border-top:0}
.fix-row .k{font-size:11.5px;font-weight:600;color:var(--ink-4)}
.fix-row s{font-family:var(--mono);font-size:12px;color:var(--red);opacity:.7;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.fix-row .arr{color:var(--ink-4);font-size:12px}
.fix-row ins{justify-self:start;font-family:var(--mono);font-size:12px;color:var(--green);text-decoration:none;background:var(--green-soft);padding:2px 7px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{padding:2px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13px;border-top:1px dashed var(--line)}
.sum div:first-child{border-top:0}
.sum div span:first-child{color:var(--ink-3)}
.sum div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.sum .tot span{font-weight:700;color:var(--ink)!important}
.act-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding-top:18px;border-top:1px solid var(--line-2)}
.act-foot .note{margin-right:auto;font-size:12px;color:var(--ink-4)}
.act-prog .tile-row{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.act-prog b{font-family:var(--mono);color:var(--blue-d);font-size:13px}
.bar{height:6px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a9c3fb,var(--blue))}
.sub{list-style:none;display:flex;flex-direction:column;gap:11px}
.sub li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-4);animation:ink 0s var(--s) forwards}
@keyframes ink{to{color:var(--ink-2)}}
.sub .ic{position:relative;width:18px;height:18px;flex-shrink:0}
.sub .ic::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--line-2)}
.sub .spin{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--blue);opacity:0;animation:spin .8s linear infinite,on 0s var(--s) forwards,off .2s var(--e) forwards}
.sub .ok{position:absolute;inset:-1px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;opacity:0;animation:pop .3s var(--e) forwards}
.sub .ok svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.next{font-size:13px;color:var(--ink-2)}
/* View transitions — rail and stage slide, the opened page morphs between them */
.upload-rail{view-transition-name:rail}
.stage{view-transition-name:stage}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-group(hero){animation-duration:.7s;animation-timing-function:cubic-bezier(.16,1,.3,1);z-index:10}
::view-transition-old(hero){animation:vt-fade-out .25s ease both}
::view-transition-new(hero){animation:vt-fade-in .25s ease both}
::view-transition-image-pair(hero){filter:drop-shadow(0 18px 30px rgba(16,33,59,.18))}
html[data-vt="in"]::view-transition-old(stage){animation:vt-out-left .16s cubic-bezier(.4,0,1,1) both}
html[data-vt="in"]::view-transition-new(stage){animation:vt-in-right .55s cubic-bezier(.22,1,.36,1) .16s both}
html[data-vt="in"]::view-transition-old(rail){animation:vt-out-left .16s cubic-bezier(.4,0,1,1) both}
html[data-vt="in"]::view-transition-new(rail){animation:vt-in-up .5s cubic-bezier(.22,1,.36,1) .18s both}
html[data-vt="back"]::view-transition-old(stage){animation:vt-out-right .16s cubic-bezier(.4,0,1,1) both}
html[data-vt="back"]::view-transition-new(stage){animation:vt-in-left .55s cubic-bezier(.22,1,.36,1) .16s both}
html[data-vt="back"]::view-transition-old(rail){animation:vt-out-down .16s cubic-bezier(.4,0,1,1) both}
html[data-vt="back"]::view-transition-new(rail){animation:vt-in-up .5s cubic-bezier(.22,1,.36,1) .18s both}
html[data-vt="fade"]::view-transition-old(stage){animation:vt-fade-out .15s ease both}
html[data-vt="fade"]::view-transition-new(stage){animation:vt-in-up .45s cubic-bezier(.22,1,.36,1) .1s both}
html[data-vt] .act,html[data-vt] #focusPane{animation:none}
@keyframes vt-fade-in{from{opacity:0}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-in-right{from{opacity:0;transform:translateX(28px)}}
@keyframes vt-in-left{from{opacity:0;transform:translateX(-28px)}}
@keyframes vt-out-left{to{opacity:0;transform:translateX(-16px)}}
@keyframes vt-out-right{to{opacity:0;transform:translateX(16px)}}
@keyframes vt-in-up{from{opacity:0;transform:translateY(10px)}}
@keyframes vt-out-down{to{opacity:0;transform:translateY(8px)}}

/* Migration metrics — a compact strip that expands into charts */
.metrics{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.is-focus .metrics{display:none}
.m-compact{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.metrics.open .m-compact{cursor:default}
.m-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.m-lbl{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}
.m-total{font-size:12.5px;color:var(--ink-3)}
.m-total b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-left:4px}
.m-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--blue)}
.m-toggle:hover{background:var(--blue-soft)}
.m-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.metrics.open .m-toggle svg{transform:rotate(180deg)}
.m-bar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--bg-2)}
.m-bar i{flex:0 1 0;min-width:0;transition:flex-grow .8s var(--ease-out)}
.m-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-3)}
.m-legend span{display:inline-flex;align-items:center;gap:6px}
.m-legend i{width:8px;height:8px;border-radius:2px}
.m-legend b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.m-legend em{font-style:normal;color:var(--ink-4);font-size:11px;font-variant-numeric:tabular-nums}
.m-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.22,1,.36,1)}
.metrics.open .m-more{grid-template-rows:1fr}
.m-more-in{overflow:hidden;min-height:0}
.m-charts{opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .45s var(--ease)}
.metrics.open .m-charts{opacity:1;transform:none;transition-delay:.08s}
.metrics.grow .m-lob rect,.metrics.grow .m-lob path{transform-box:fill-box;transform-origin:50% 100%;animation:mgrow .8s cubic-bezier(.22,1,.36,1) both}
.metrics.grow .m-lob .tot{animation:vt-fade-in .4s ease .5s both}
@keyframes mgrow{from{transform:scaleY(0)}}
.m-charts{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line-2)}
.m-card{border:1px solid var(--line-2);border-radius:12px;padding:14px 16px}
.m-donut-wrap{position:relative;max-width:250px;margin:10px auto 0}
.m-donut{width:100%;display:block}
.m-donut .arc{fill:none;stroke-width:22;transition:stroke-dasharray .8s var(--ease-out),stroke-dashoffset .8s var(--ease-out)}
.m-center{position:absolute;left:0;right:0;bottom:0;text-align:center}
.m-center b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.m-center small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:650}
.m-list{list-style:none;margin-top:12px}
.m-list li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 46px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0;color:var(--ink-2)}
.m-list i{width:10px;height:10px;border-radius:3px}
.m-list b{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink)}
.m-list em{font-style:normal;text-align:right;color:var(--ink-4);font-size:11.5px;font-variant-numeric:tabular-nums}
.m-lob{width:100%;display:block;margin-top:8px}
.m-lob text{font-family:var(--font);font-size:10px;fill:var(--ink-4)}
.m-lob .grid{stroke:var(--line-2);stroke-width:1}
.m-lob .tot{fill:var(--ink-3);font-weight:650}
.m-tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;opacity:0;transition:opacity .12s;white-space:nowrap}
@media(max-width:1100px){.m-charts{grid-template-columns:1fr}}

/* Ready for your go-ahead */
.rd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line-2)}
.rd-file{font-size:13px;color:var(--ink-3);margin-top:8px}
.chip-ok{flex-shrink:0;background:var(--green-soft);color:var(--green);font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:7px}
.rd-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rd-stats small{display:block;font-size:12px;color:var(--ink-3)}
.rd-stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.rd-stats span{font-size:12px;color:var(--ink-3)}
.ok-note{display:flex;gap:10px;align-items:center;padding:13px 16px;border-radius:10px;background:#eaf6ef;color:var(--ink-2);font-size:13px;line-height:1.45}
.ok-note svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.disc summary{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;color:var(--blue);cursor:pointer;list-style:none}
.disc summary::-webkit-details-marker{display:none}
.disc summary::before{content:'';border:4.5px solid transparent;border-left:6px solid currentColor;border-right:0;transition:transform .2s var(--ease)}
.disc[open] summary::before{transform:rotate(90deg)}
.disc-body{margin-top:10px;border:1px solid var(--line-2);border-radius:10px;padding:2px 14px}
.disc-body div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--line)}
.disc-body div:first-child{border-top:0}
.disc-body div span:last-child{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);white-space:nowrap}
.appeal{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#f8f9fc}
.appeal h4{font-size:14px;font-weight:650}
.appeal p{font-size:13px;color:var(--muted);margin:5px 0 12px}
.auth{padding:18px 18px 16px;border-radius:12px;background:#f4f6fb}
.auth-lbl{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.auth-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.auth-row b{font-weight:700;color:var(--ink)}
.auth-row.tot{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);font-size:16px;font-weight:650;color:var(--ink)}
.auth-row.tot b{font-size:16px}
.auth-note{font-size:12px;color:var(--ink-3);margin-top:8px}
.auth-check{font-size:13px;line-height:1.55}
.auth-check b{font-weight:650;color:var(--ink)}
.submit-full{width:100%;height:46px;font-size:13.5px}
.submit-full svg{width:15px;height:15px}
.concept{font-size:12px;color:var(--ink-4);margin-top:-8px}
@media(max-width:1100px){.act-stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-logo" src="https://www.figma.com/api/mcp/asset/920b72a7-c011-4c14-963f-f22abbe601db" alt="WiselyConsent">
    </div>
    <nav class="sidebar-nav">
      <div class="nav-lbl">Operate</div>
      <a class="nav-item active" href="#" aria-current="page">Migration</a>
      <a class="nav-item is-muted" href="#">Integrations</a>
      <a class="nav-item is-muted" href="#">Consent Acquisition</a>
    </nav>
    <div class="sidebar-user"><b>Ravi Menon</b><span>Super Admin</span></div>
  </aside>

  <main class="main">
    <div class="workspace">
      <!-- Fixed upload -->
      <aside class="upload-rail" aria-label="Upload consents">
       <div class="rail-pane" id="uploadPane">
        <div>
          <h1>Upload</h1>
          <p class="lead">Add one or more CSVs per LoB. The agent prepares each file — you only act when asked.</p>
        </div>
<div class="field">
          <label for="lob">Line of business</label>
          <select id="lob">
            <option value="">Select LoB…</option>
            <option>Credit Cards</option>
            <option>Personal Loans</option>
            <option>Savings Accounts</option>
            <option>Home Loans</option>
            <option>Insurance</option>
          </select>
        </div>
        <div class="drop" id="drop" role="button" tabindex="0" aria-label="Add CSV files, encrypted in your browser">
          <span class="enc-badge"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Encrypted<button type="button" class="enc-info" title="About encryption" aria-label="About encryption"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></span>
          <div class="drop-art">
            <div class="paper" aria-hidden="true">
              <span class="back b2"></span>
              <span class="back"></span>
              <div class="sheet">
                <div class="sheet-clip" id="dropSheet"></div>
                <span class="scan"></span>
                <span class="drop-plus"><svg viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 19h14"/></svg></span>
                <span class="drop-lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>
              </div>
              <span class="drop-count" id="dropCount"></span>
            </div>
          </div>
          <b id="fileLabel">Drop CSVs here</b>
          <p>Up to 500 MB each · as many files per LoB as you need</p>
          <div class="drop-btns">
            <button type="button" class="btn btn-sm" id="browse">Choose files</button>
            <button type="button" class="btn btn-ghost btn-sm" id="sample">Try sample</button>
          </div>
          <input type="file" id="file" accept=".csv" multiple hidden>
        </div>
        <ul class="picked-list" id="pickedList" hidden></ul>
        <div class="af-row">
          <label for="autofix" class="af-lbl">Autofix errors</label>
          <span class="info" tabindex="0" role="img" aria-label="About autofix" title="About autofix"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
          <span class="switch"><input type="checkbox" id="autofix" checked aria-label="Autofix errors"><span class="track"></span></span>
        </div>
        <div id="uploadError" class="error" hidden></div>
        <label class="declare">
          <input type="checkbox" id="declare">
          <span>I confirm these consents comply with TRAI regulations and have been verified.</span>
        </label>
        <button type="button" class="btn btn-pri btn-full" id="uploadBtn" disabled>Upload securely</button>
        <button type="button" class="btn btn-sm" id="seedDemo" style="align-self:flex-start">Load sample queue</button>
       </div>
       <div class="rail-pane" id="focusPane" hidden></div>
      </aside>

      <!-- Right representation -->
      <section class="stage" aria-label="Migration files">
        <div class="metrics" id="metrics" hidden></div>
        <div class="stage-bar">
          <div class="filters" role="tablist" aria-label="Filter">
            <button type="button" class="chip-btn is-on" data-filter="all">All <span class="n" id="cAll">0</span></button>
            <button type="button" class="chip-btn" data-filter="needs">Needs you <span class="n" id="cNeeds">0</span></button>
            <button type="button" class="chip-btn" data-filter="run">In progress <span class="n" id="cRun">0</span></button>
            <button type="button" class="chip-btn" data-filter="done">Done <span class="n" id="cDone">0</span></button>
          </div>
          <div class="layouts" role="group" aria-label="Layout">
            <button type="button" class="chip-btn is-on" data-layout="page" title="All files">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Files
            </button>
            <button type="button" class="chip-btn" data-layout="folder" title="Files grouped by LOB">
              <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
              LOBs
            </button>
          </div>
        </div>
        <p class="stage-hint" id="hint">Each page fills as the agent reads it.</p>
        <div id="canvas"></div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d5d9"/><stop offset="1" stop-color="#bdbec3"/></linearGradient>
</defs></svg>

<script>
(() => {
  const STAGES = [
    { id:'upload', label:'Uploading', tip:'Sealing and sending your file' },
    { id:'validate', label:'Validating', tip:'Checking columns and formats' },
    { id:'fix', label:'Autofix', tip:'Applying safe format fixes' },
    { id:'verify', label:'Verifying', tip:'Authenticity checks running' },
    { id:'ready', label:'Ready', tip:'Waiting for your go-ahead' }
  ];

  let jobs = [];
  let nextId = 1;
  let picked = [];
  let filter = 'all';
  let layout = 'page';

  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num = n => Number(n||0).toLocaleString('en-IN');
  const toast = msg => {
    const t=$('#toast'); t.textContent=msg; t.classList.add('is-on');
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('is-on'),2200);
  };

  const needsYou = j => j.phase==='fix_review' || j.phase==='ready';
  const isRunning = j => ['upload','received','validate','fix','verify'].includes(j.phase);
  const isDone = j => j.phase==='submitted' || j.phase==='cancelled';

  /* Running files advance continuously: 0 → 100% in one minute of agent time */
  const RATE = 100 / 60000;
  const PHASE_AT = { upload:5, received:15, validate:30, fix:50, fix_review:42, verify:80, ready:100, submitted:100, cancelled:0 };
  const progressF = j => (isRunning(j) || j.phase==='fix_review') && j.p != null ? j.p : (PHASE_AT[j.phase] ?? 0);
  const progress = j => Math.round(progressF(j));

  function stageInfo(j) {
    if (j.phase==='fix_review') return { key:'fix', label:'Review errors', tip:'Errors found · autofix or skip', cls:'attn' };
    if (j.phase==='ready') return { key:'ready', label:'Ready to submit', tip:'Authorize when you’re ready', cls:'attn' };
    if (j.phase==='submitted') return { key:'ready', label:'Submitted', tip:'Migration received', cls:'ok' };
    if (j.phase==='cancelled') return { key:'upload', label:'Cancelled', tip:'', cls:'' };
    const i = { upload:0, received:0, validate:1, fix:2, verify:3 }[j.phase] ?? 0;
    const s = STAGES[i];
    return { key:s.id, label:s.label, tip:s.tip, cls: isRunning(j) ? 'run' : '' };
  }

  function tileClass(j) {
    if (needsYou(j)) return 'attn needs';
    if (j.phase==='submitted') return 'ok done';
    if (isRunning(j)) return 'run';
    return '';
  }

  const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
  function updateUpload() {
    const n = picked.length, sealing = picked.filter(f => !f.sealed).length;
    const b = $('#uploadBtn');
    b.disabled = !(n && !sealing && $('#declare').checked && $('#lob').value);
    b.innerHTML = LOCK + (sealing ? `Encrypting ${sealing} file${sealing>1?'s':''}…` : n > 1 ? `Upload ${n} sealed files` : n ? 'Upload sealed file' : 'Upload securely');
    const d = $('#drop');
    d.classList.toggle('sealing', sealing > 0);
    d.classList.toggle('sealed', n > 0 && !sealing);
    $('#fileLabel').textContent = n === 0 ? 'Drop CSVs here' : sealing ? 'Encrypting in your browser…' : n === 1 ? `${picked[0].name} · sealed` : `${n} files sealed`;
  }
  const hex = n => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
  function pickedRow(f, i) {
    return `<li class="${f.sealed ? 'sealed' : 'sealing'}" data-name="${esc(f.name)}"><span class="pi"><span class="lk">${LOCK}</span></span>
      <span class="pl"><b title="${esc(f.name)}">${esc(f.name)}</b><span class="st">${f.sealed ? `Sealed · SHA-256 ${f.hash}` : 'Encrypting in browser'}</span><span class="pbar"><i></i></span></span>
      <span class="sz">${fmtSize(f.size)}</span><button type="button" data-rm="${i}" aria-label="Remove ${esc(f.name)}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>`;
  }

  const fmtSize = b => b >= 1048576 ? `${(b/1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b/1024))} KB`;
  function renderPicked() {
    const n = picked.length, d = $('#drop');
    d.classList.toggle('is-picked', n > 0);
    d.classList.toggle('multi', n > 1);
    $('#dropCount').textContent = n > 1 ? `${n} files` : '';
    $('#browse').textContent = n ? 'Add more' : 'Choose files';
    const ul = $('#pickedList');
    ul.hidden = !n;
    ul.innerHTML = picked.map(pickedRow).join('');
    updateUpload();
  }

  function addFiles(list) {
    const err = $('#uploadError'), bad = [];
    err.hidden = true;
    for (const f of list) {
      if (!f.name.toLowerCase().endsWith('.csv')) { bad.push(`${f.name} isn’t a CSV`); continue; }
      if (f.size > 500*1024*1024) { bad.push(`${f.name} is over 500 MB`); continue; }
      if (picked.some(p => p.name === f.name)) continue;
      const item = { name: f.name, size: f.size, sealed: false };
      picked.push(item);
      /* seal each file in the browser before it can be uploaded */
      setTimeout(() => {
        item.sealed = true; item.hash = `${hex(4)}…${hex(4)}`;
        const li = $$('#pickedList li').find(l => l.dataset.name === item.name);
        if (li) { li.className = 'sealed'; $('.st', li).textContent = `Sealed · SHA-256 ${item.hash}`; }
        updateUpload();
      }, 1100 + picked.length * 350);
    }
    if (bad.length) { err.textContent = bad.join(' · '); err.hidden = false; }
    renderPicked();
  }

  function filtered() {
    return jobs.filter(j => {
      if (filter==='needs') return needsYou(j);
      if (filter==='run') return isRunning(j);
      if (filter==='done') return isDone(j);
      return true;
    });
  }

  /* deterministic per-file layout so every page looks a little different */
  const SIG = 'M3 16c2-5 5-11 7-10s-3 12-1 13 5-9 7-9-1 7 1 7 3-5 5-4 1 4 3 3l9-4';
  function seeded(n) {
    let x = (n * 2654435761) >>> 0 || 1;
    return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  }
  function docHTML(id) {
    const r = seeded(id + 7), w = (a, b) => Math.round(a + r() * (b - a));
    const L = ws => ws.map(x => `<i style="width:${x}%"></i>`).join('');
    return `<div class="doc">
      <div class="doc-head"><span class="doc-img"></span><span class="doc-hl">${L([w(58,74), w(82,96), w(40,56)])}</span></div>
      <div class="doc-p">${L([100, w(86,98), w(58,78)])}</div>
      <div class="doc-p">${L([w(94,100), w(72,90), w(80,96), w(36,56)])}</div>
      <svg class="doc-sig" viewBox="0 0 40 24"><path d="${SIG}"/></svg>
    </div>`;
  }

  /* stamp on the page: a tick once submitted, a pen when it needs sign-off, ! when errors need review */
  const STAMP = { submitted: 'M6 12.5l4 4 8-9', ready: 'M4 20l4-1 10-10-3-3L5 16l-1 4zM13 8l3 3', fix_review: 'M12 7v6M12 17h.01' };
  function paperHTML(j) {
    const doc = docHTML(j.id);
    return `<div class="paper" aria-hidden="true">
      <span class="back"></span>
      <div class="sheet">
        <div class="sheet-clip">${doc}<div class="read">${doc}<span class="trail"></span></div></div>
        <span class="scan"></span>
        <span class="doc-stamp"><svg viewBox="0 0 24 24"><path d="${STAMP[j.phase] || STAMP.submitted}"/></svg></span>
      </div>
    </div>`;
  }

  function fileTile(j) {
    const pct = progress(j);
    const st = stageInfo(j);
    const act = j.phase==='ready'
      ? `<button class="btn btn-pri btn-sm tile-act" data-act="review" data-id="${j.id}">Submit</button>`
      : j.phase==='fix_review'
        ? `<button class="btn btn-pri btn-sm tile-act" data-act="fix" data-id="${j.id}">Review errors</button>`
        : j.phase==='submitted'
          ? `<button class="btn btn-sm tile-act" data-act="receipt" data-id="${j.id}">Receipt</button>`
          : '';
    return `<article class="file-tile ${tileClass(j)}${pct>=100?' full':''}" style="--fill:${pct}%" data-key="t${j.id}" data-sig="${j.phase}" data-fk="t${j.id}" data-to="${pct}" data-id="${j.id}" tabindex="0" role="button" title="${esc(st.tip)}" aria-label="${esc(j.name)}, ${pct}% ${st.label}">
      <div class="tile-art">
        ${paperHTML(j)}
        <div class="tile-top"><span class="tile-lob">${esc(j.lob)}</span><span class="tile-stage ${st.cls}">${st.cls==='run'||st.cls==='attn'?'<i class="pulse"></i>':''}${esc(st.label)}</span></div>
        <span class="tile-pct">${pct}%</span>
      </div>
      <div class="tile-foot">

  function patch(canvas, html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();

    const keys = el => [...el.children].map(c => c.dataset.key).join('|');
    if (cur && next && next.dataset.view && cur.dataset.view === next.dataset.view && keys(cur) === keys(next)) {
      const curKids = [...cur.children];
      [...next.children].forEach((n, i) => {
        if (curKids[i].dataset.sig === n.dataset.sig) return;
        curKids[i].replaceWith(n);
        if (!RM) n.animate([{ opacity: .55, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.22,1,.36,1)' });

      el.style.setProperty('--fill', from + '%');
      moving.push([el, from, to]);

      </div>
      <div class="m-more" id="mMore"><div class="m-more-in"><div class="m-charts">
        <div class="m-card"><div class="m-lbl">Status breakdown</div>
          <div class="m-donut-wrap"><svg class="m-donut" viewBox="0 0 200 104"><path class="arc" d="${ARC}" pathLength="100" stroke="var(--bg-2)"/>${MSTAT.map(m => `<path class="arc" data-k="${m.k}" d="${ARC}" pathLength="100" stroke="${m.c}" style="stroke-dasharray:0 200"/>`).join('')}</svg>
          <div class="m-center"><b id="mApproved">0</b><small>Approved</small></div></div>
          <ul class="m-list">${MSTAT.map(m => `<li data-k="${m.k}"><i style="background:${m.c}"></i><span>${m.l}</span><b>0</b><em>0%</em></li>`).join('')}</ul>
        </div>
        <div class="m-card"><div class="m-lbl">LOB-wise comparison</div><svg class="m-lob" id="mLob" viewBox="0 0 420 236" role="img" aria-label="Records per LOB by status"></svg></div>
      </div></div></div>`;
  }

  function lobSVG() {
    const groups = foldersFrom(jobs).map(([lob, files]) => ({ lob, b: sumBuckets(files), t: files.reduce((s, j) => s + j.total, 0) }));
    const W = 420, H = 236, L = 38, R = 8, T = 18, B = 30, pw = W - L - R, ph = H - T - B;
    const max = Math.max(1, ...groups.map(g => g.t));
    const raw = max / 4, pow = 10 ** Math.floor(Math.log10(raw)), n = raw / pow;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow, top = Math.ceil(max / step) * step;
    const y = v => T + ph - v / top * ph;
    let out = '';
    for (let v = 0; v <= top; v += step) out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${fmtK(v)}</text>`;
    const band = pw / groups.length, bw = Math.min(24, band * .5);
    groups.forEach((g, i) => {
      const x = L + band * i + (band - bw) / 2;
      let base = 0;
      const segs = MSTAT.filter(m => g.b[m.k] > 0);
      segs.forEach((m, si) => {
        const v = g.b[m.k], y0 = y(base), y1 = y(base + v), last = si === segs.length - 1;
        const h = Math.max(0, y0 - y1 - (si > 0 ? 2 : 0)), yy = y0 - (si > 0 ? 2 : 0) - h, r = Math.min(4, h, bw / 2);
        const tip = `${esc(g.lob)} · ${m.s}: ${num(v)} (${pctOf(v, g.t)})`;
        out += last
          ? `<path data-tip="${tip}" fill="${m.c}" d="M${x},${yy + h} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${yy + h} Z"/>`
          : `<rect data-tip="${tip}" fill="${m.c}" x="${x}" y="${yy}" width="${bw}" height="${h}"/>`;
        base += v;
      });
      out += `<text class="tot" x="${x + bw / 2}" y="${y(g.t) - 6}" text-anchor="middle">${fmtK(g.t)}</text>`;
      out += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${esc(g.lob)}</text>`;
    });
    return out;
  }

  function renderMetrics() {
    const el = $('#metrics');
    el.hidden = !jobs.length;
    if (!jobs.length) return;
    if (!el.dataset.built) {
      el.innerHTML = metricsShell(); el.dataset.built = '1';
      el.addEventListener('click', e => {
        if (!e.target.closest('#mToggle') && (metricsOpen || !e.target.closest('.m-compact'))) return;
        metricsOpen = !metricsOpen;
        el.classList.toggle('open', metricsOpen);
        if (metricsOpen && !RM) {
          /* replay the charts: arcs sweep in, columns grow from the baseline */
          $$('.arc[data-k]', el).forEach(a => { a.style.transition = 'none'; a.style.strokeDasharray = '0 200'; a.style.strokeDashoffset = '0'; });
          el.getBoundingClientRect();
          $$('.arc[data-k]', el).forEach(a => { a.style.transition = ''; });
          el.classList.add('grow');
          requestAnimationFrame(() => renderMetrics());
          setTimeout(() => el.classList.remove('grow'), 1200);
        }
        $('#mToggle').setAttribute('aria-expanded', metricsOpen);
        $('#mToggle span').textContent = metricsOpen ? 'Hide charts' : 'View charts';
      });
    }
    const b = sumBuckets(jobs), total = MSTAT.reduce((s, m) => s + b[m.k], 0);
    $('#mTotal').textContent = num(total);
    $('#mApproved').textContent = num(b.approved);
    let start = 0;
    MSTAT.forEach(m => {
      const v = b[m.k], pc = pctOf(v, total), len = total ? v / total * 100 : 0;
      const seg = $(`.m-bar i[data-k="${m.k}"]`, el);
      seg.style.flexGrow = v; seg.hidden = !v; seg.dataset.tip = `${m.l}: ${num(v)} (${pc})`;
      const lg = $(`.m-legend [data-k="${m.k}"]`, el); $('b', lg).textContent = num(v); lg.title = pc;
      const li = $(`.m-list [data-k="${m.k}"]`, el); $('b', li).textContent = num(v); $('em', li).textContent = pc;
      const arc = $(`.arc[data-k="${m.k}"]`, el);
      arc.style.strokeDasharray = `${Math.max(0, len - (len > 1 ? .8 : 0))} 200`;
      arc.style.strokeDashoffset = `${-start}`;
      arc.dataset.tip = `${m.l}: ${num(v)} (${pc})`;
      start += len;
    });
    $('#mLob').innerHTML = lobSVG();

  const mTip = document.createElement('div');

        ? `<div class="folder-grid" data-view="folder">${groups.map(([lob, files]) => folderCard(lob, files)).join('')}</div>`

  function renderFocus(canvas, fp) {
    if (focus.type === 'file') {
      const j = jobs.find(x => x.id === focus.id);
      const sig = `f|${j.id}|${j.phase}|${focus.from || ''}`;
      if (fp.dataset.sig !== sig) { fp.innerHTML = fileRail(j); fp.dataset.sig = sig; animateFills(fp); }
      $('#hint').textContent = '';
      patch(canvas, actionPanel(j));
    } else {
      const files = jobs.filter(j => j.lob === focus.lob);
      const sig = `d|${focus.lob}|${files.map(j => j.id + j.phase).join()}`;
      if (fp.dataset.sig !== sig) { fp.innerHTML = folderRail(focus.lob, files); fp.dataset.sig = sig; animateFills(fp); }
      $('#hint').innerHTML = `<strong>${esc(focus.lob)}</strong> · ${files.length} file${files.length===1?'':'s'}. Open one to see its timeline and what it needs.`;
      patch(canvas, `<div class="page-grid" data-view="lob-${esc(focus.lob)}">${files.map(fileTile).join('')}</div>`);

  /* ---------- moving a page or folder between the grid and the rail ---------- */
  const tplNode = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  function snapshot(host, sel) {
    const node = host && host.querySelector(sel);
    if (!node) return null;
    return { rect: node.getBoundingClientRect(), node: node.cloneNode(true), cls: host.className, fill: host.style.getPropertyValue('--fill') };
  }
  function fly(snap, dst, ms = 680) {
    if (!snap || !dst || RM) { if (dst) dst.style.visibility = ''; return; }
    const s = snap.rect, d = dst.getBoundingClientRect(), W = dst.offsetWidth, H = dst.offsetHeight;
    const g = document.createElement('div');
    g.className = `${snap.cls} focus-tile`;
    g.style.cssText = `position:fixed;left:${s.left}px;top:${s.top}px;width:${W}px;height:${H}px;z-index:70;pointer-events:none;transform-origin:0 0;margin:0;padding:0`;
    if (snap.fill) g.style.setProperty('--fill', snap.fill);
    snap.node.style.cssText += ';position:absolute;inset:0;scale:1;transform:none;margin:0;visibility:visible';
    g.appendChild(snap.node);
    document.body.appendChild(g);
    dst.style.visibility = 'hidden';
    const a = g.animate([
      { transform: `scale(${s.width / W})` },
      { transform: `translate(${d.left - s.left}px,${d.top - s.top}px) scale(${d.width / W})` },
    ], { duration: ms, easing: 'cubic-bezier(.22,1,.36,1)' });
    const done = () => { g.remove(); dst.style.visibility = ''; };
    a.onfinish = done; a.oncancel = done;
  }

  /* View transitions: the opened page or folder morphs between grid and rail while
     the rail and stage slide; browsers without them fall back to the flying ghost. */
  const HAS_VT = !!document.startViewTransition;
  function morph(mode, update, from, toSel) {
    if (!HAS_VT || RM) return false;
    document.documentElement.dataset.vt = mode;
    if (from) from.style.viewTransitionName = 'hero';
    const vt = document.startViewTransition(() => {
      if (from) from.style.viewTransitionName = '';
      update();
      const to = toSel && toSel();
      if (to) to.style.viewTransitionName = 'hero';
    });
    vt.finished.finally(() => {
      delete document.documentElement.dataset.vt;
      $$('[style*="view-transition-name"]').forEach(el => { el.style.viewTransitionName = ''; });
    });
    return true;
  }

  function openFile(id, host) {
    const j = jobs.find(x => x.id === id);
    if (!j) return;
    lastFill.set(`r${id}`, progress(j));
    const next = { type: 'file', id, from: focus && focus.type === 'folder' ? focus.lob : null };
    const src = host.querySelector('.paper');
    if (morph('in', () => { focus = next; render(); scrollTo({ top: 0 }); }, src, () => $('#focusPane .paper'))) return;
    const snap = snapshot(host, '.paper');
    focus = next; render(); scrollTo({ top: 0 });
    fly(snap, $('#focusPane .paper'));
  }
  function openFolder(lob, host) {
    lastFill.set(`rf${lob}`, +host.dataset.to);
    const src = host.querySelector('.folder');
    if (morph('in', () => { focus = { type: 'folder', lob }; render(); scrollTo({ top: 0 }); }, src, () => $('#focusPane .folder'))) return;
    const snap = snapshot(host, '.folder');
    focus = { type: 'folder', lob }; render(); scrollTo({ top: 0 });
    fly(snap, $('#focusPane .folder'));
  }
  function navigate(to) {
    if (!focus) return;
    const prev = focus;
    if (to === 'upload-more') {
      const go = () => { focus = null; render(); $('#lob').value = prev.lob; updateUpload(); };
      if (!morph('back', go)) go();
      $('#drop').focus();
      return;
    }
    const next = to === 'back' && prev.type === 'file' && prev.from ? { type: 'folder', lob: prev.from } : null;
    const findDst = () => prev.type === 'file'
      ? $(`#canvas [data-key="t${prev.id}"] .paper`)
      : ($$('#canvas .folder-card').find(c => c.dataset.lob === prev.lob) || null)?.querySelector('.folder');
    const src = $(`#focusPane .focus-tile ${prev.type === 'file' ? '.paper' : '.folder'}`);
    const go = () => { focus = next; render(); const d = findDst(); if (d) d.closest('article').scrollIntoView({ block: 'nearest' }); };
    if (morph('back', go, src, findDst)) return;
    const snap = snapshot($('#focusPane .focus-tile'), prev.type === 'file' ? '.paper' : '.folder');
    go();
    fly(snap, findDst());
  }
  document.addEventListener('click', e => { const n = e.target.closest('[data-nav]'); if (n) navigate(n.dataset.nav); });

  function doAction(a) {
    const j = focus && focus.type === 'file' && jobs.find(x => x.id === focus.id);
    if (!j) return;
    if (a === 'apply' || a === 'skip') {
      j.fixedApplied = a === 'apply' ? j.fixed : 0;
      j.phase = a === 'apply' ? 'fix' : 'verify'; j.fixDone = true;
      render(); startTicker();
      toast(a === 'apply' ? `Autofixing ${num(j.fixed)} errors` : 'Continuing without fixes');
    }
    if (a === 'submit' && $('#authz') && $('#authz').checked) {
      j.phase = 'submitted';
      render(); toast(`${j.name} submitted`);
    }
    if (a === 'receipt') toast('Receipt downloaded');
    if (a === 'appeal') toast('Appeal review opens separately');
  }

  /* ---------- the agent: one frame loop advances every running file ---------- */
  let raf = 0, lastT = 0;
  function startTicker() { if (!raf && jobs.some(isRunning)) { lastT = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(100, now - lastT); lastT = now;
    let changed = false;
    for (const j of jobs) {
      if (!isRunning(j)) continue;
      const prev = j.phase;
      j.p = Math.min(100, (j.p || 0) + dt * RATE);
      if (j.p >= 100) {
        j.failed = Math.round(j.total * .04);
        j.verified = j.valid + (j.fixedApplied || 0) - j.failed;
        j.phase = 'ready';
        toast(`${j.name} is ready to submit`);
      } else if (j.p >= 42 && !j.fixDone && !j.autofix) {
        /* autofix is off: stop after validation and ask the user */
        j.fixDone = true; j.p = 42; j.phase = 'fix_review';
        toast(`${j.name}: review errors`);
      } else if (j.p >= 60 && !j.fixDone) {
        j.fixDone = true; j.fixedApplied = j.fixed; j.phase = 'verify';
      } else {
        const skipped = j.fixDone && !j.fixedApplied;
        const ph = j.p >= 60 ? 'verify' : j.p >= 42 ? (skipped ? 'verify' : 'fix') : j.p >= 20 ? 'validate' : j.p >= 10 ? 'received' : 'upload';
        if (ph !== j.phase) j.phase = ph;
      }
      if (j.phase !== prev) changed = true;
    }
    if (changed) render();
    paintLive();
    raf = jobs.some(isRunning) ? requestAnimationFrame(tick) : 0;
  }
  function setFill(el, p) {
    el.style.setProperty('--fill', `${p.toFixed(2)}%`);
    el.dataset.to = Math.round(p);
    lastFill.set(el.dataset.fk, Math.round(p));
  }
  function paintLive() {
    for (const j of jobs) {
      if (!isRunning(j)) continue;
      const pr = `${Math.round(j.p)}%`;
      $$(`[data-fk="t${j.id}"],[data-fk="r${j.id}"]`).forEach(el => {
        setFill(el, j.p);
        const t = $(':scope > .tile-art > .tile-pct', el); if (t) t.textContent = pr;
      });
      $$(`[data-live-pct="${j.id}"]`).forEach(el => { el.textContent = pr; });
      $$(`[data-live-bar="${j.id}"]`).forEach(el => { el.style.width = `${j.p.toFixed(2)}%`; });
    }
    const pool = focus ? jobs : filtered();
    $$('.folder-card[data-lob]').forEach(el => {
      const fs = pool.filter(j => j.lob === el.dataset.lob);
      if (!fs.some(isRunning)) return;
      const avg = fs.reduce((s, j) => s + progressF(j), 0) / fs.length;
      setFill(el, avg);
      const t = $(':scope > .folder-foot .tile-pct', el); if (t) t.textContent = `${Math.round(avg)}%`;
      if (el.classList.contains('focus-tile')) { const d = $('[data-live-folder]'); if (d) d.textContent = `${Math.round(avg)}%`; }
    });
  }

  function startJob({lob,name,size,autofix}) {
    const total = 80000 + Math.floor(Math.random() * 180000);
    const valid = Math.round(total * .9), fixed = Math.round(total * .06), manual = Math.round(total * .03);
    const job = {
      id:nextId++, lob, name, size, autofix, phase:'upload', p:0, fixDone:false,
      total, valid, fixed, manual, dup: total - valid - fixed - manual, verified:0, failed:0, fixedApplied:0
    };
    jobs=[job,...jobs];
    return job;
  }

  $('#canvas').addEventListener('keydown', e => {

  $('#seedDemo').onclick=()=>{
    jobs=[

    ];
    const now=Date.now();
    jobs.forEach(j=>{
      j.p={upload:4,received:14,validate:31,fix:50,fix_review:42,verify:78}[j.phase] ?? 100;
      j.fixDone=!['upload','received','validate','fix'].includes(j.phase);
      const idx=j.phase==='submitted'?5:STEP_KEYS.indexOf(stepKey(j.phase));
      j.at={};
      for(let i=0;i<=idx;i++) j.at[STEP_KEYS[i]]=now-(idx-i)*(3+j.id%4)*60000;
    });
    filter='all'; layout='page'; focus=null;
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.filter==='all'));
    $$('.layouts .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.layout==='page'));
    render();
    startTicker();
    toast('Sample queue · try Files and LOBs');
  };

  const dropDoc = docHTML(3);
  $('#dropSheet').innerHTML = `${dropDoc}<div class="read">${dropDoc}<span class="trail"></span></div>`;
  render();
  renderPicked();
})();
</script>
</body>
</html>
