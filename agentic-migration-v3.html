<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Migration v3 — WiselyConsent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css">
<style>
:root{
  --ink:#10213b; --ink-2:#3d4a63; --ink-3:#5c6781; --ink-4:#8590a8; --muted:#64728c;
  --bg:#f5f6fb; --bg-2:#eef1f7; --card:#fff;
  --line:#e2e8f2; --line-2:#eef1f6;
  --blue:#2560f6; --blue-d:#154ace; --blue-soft:#edf3ff; --blue-border:#cddcff;
  --green:#118252; --green-soft:#eaf7f0;
  --amber:#935e13; --amber-soft:#fff6e6;
  --red:#b73c4a;
  --sidebar:220px; --upload:320px;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --font:'Geist',Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --sh:0 4px 22px #14294408;
  --sh-2:0 8px 28px rgba(20,41,68,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-header{padding:16px 14px;border-bottom:1px solid var(--line)}
.sidebar-logo{height:28px;width:140px;object-fit:contain}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-lbl{padding:8px 10px 4px;font-size:11px;font-weight:650;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none}
.nav-item.active{background:var(--blue-soft);color:var(--blue-d);font-weight:650}
.nav-item.is-muted{opacity:.4;pointer-events:none}
.sidebar-user{padding:14px;border-top:1px solid var(--line);font-size:13px}
.sidebar-user b{display:block}.sidebar-user span{color:var(--ink-4);font-size:11.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.workspace{flex:1;display:grid;grid-template-columns:var(--upload) minmax(0,1fr);min-height:0}
.upload-rail{border-right:1px solid var(--line);background:var(--card);padding:22px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.upload-rail h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.upload-rail .lead{font-size:12.5px;color:var(--muted);line-height:1.5}
.secure{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:var(--blue-soft);border:1px solid var(--blue-border);font-size:11px;font-weight:600;color:var(--blue-d)}
.secure svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.field label{display:block;font-size:11px;font-weight:650;color:var(--ink-3);margin-bottom:5px}
.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fcfdff}
.drop{border:1.5px dashed var(--blue-border);border-radius:12px;background:linear-gradient(180deg,#fbfcff,#f3f7ff);padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .18s var(--ease),background .18s,box-shadow .18s}
.drop.is-drag,.drop.is-picked{border-color:var(--blue);border-style:solid;background:var(--blue-soft);box-shadow:0 0 0 4px rgba(37,96,246,.08)}
.drop b{font-size:13px;font-weight:650}
.drop p,.caption{font-size:11.5px;color:var(--ink-4);line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn:hover{border-color:#baccef;background:#f9fbff}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 3px #2560f620}
.btn-pri:hover{background:var(--blue-d)}
.btn-pri:disabled{background:#c6d3ea;border-color:#c6d3ea;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{height:32px;padding:0 11px;font-size:12px}
.btn-full{width:100%}
.btn-ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn-ghost:hover{background:var(--blue-soft)}
.declare,.toggle{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.declare input,.toggle input{margin-top:2px;accent-color:var(--blue)}
.more{border-top:1px solid var(--line);padding-top:10px}
.more summary{font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.error{padding:9px 11px;border-radius:9px;background:#fff0f2;color:var(--red);font-size:12px;font-weight:550}

/* Right stage */
.stage{padding:20px 22px 36px;min-width:0;display:flex;flex-direction:column;gap:14px}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filters,.layouts{display:inline-flex;padding:3px;background:var(--bg-2);border-radius:10px;gap:2px}
.chip-btn{height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.chip-btn.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,26,51,.06)}
.chip-btn .n{margin-left:3px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.chip-btn.is-on .n{color:var(--blue)}
.layouts .chip-btn{display:inline-flex;align-items:center;gap:6px}
.layouts .chip-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.stage-hint{font-size:12.5px;color:var(--muted)}
.stage-hint strong{color:var(--ink);font-weight:650}

/* Tint per state — every fill, line and glow reads from --t at low alpha */
.file-tile,.folder-card,.mini-tile{--t:100 116 139}
.file-tile.run,.folder-card.run,.mini-tile.run{--t:37 96 246}
.file-tile.attn,.folder-card.needs,.mini-tile.attn{--t:196 132 29}
.file-tile.ok,.folder-card.ok,.mini-tile.ok{--t:22 150 96}

/* Page grid — document tiles */
.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.file-tile{position:relative;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s}
.file-tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#d6e1f7}
.file-tile:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.file-tile.needs{border-color:#f0dcb4;box-shadow:0 0 0 3px rgba(196,132,29,.07),var(--sh)}
.file-tile.done{opacity:.94}
.tile-art,.folder-art{position:relative;height:212px;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#fcfdfe 0%,#f2f4f8 100%);border-bottom:1px solid var(--line-2);container-type:inline-size}

/* the page: a back sheet fanned out, a front sheet with real document structure */
.paper{position:relative;width:132px;height:172px;transition:transform .35s var(--ease)}
.paper .back{position:absolute;inset:0;border-radius:7px;background:#f6f7f9;border:1px solid #e7eaf0;transform:translate(9px,5px) rotate(4.5deg);box-shadow:0 8px 18px -8px rgba(16,33,59,.10);transition:transform .35s var(--ease)}
.paper .sheet{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,#fff,#fdfdfe);border:1px solid #e8ecf2;box-shadow:0 1px 2px rgba(16,33,59,.04),0 8px 18px -6px rgba(16,33,59,.09),0 22px 38px -18px rgba(16,33,59,.14)}
.file-tile:hover .paper{transform:translateY(-3px)}
.file-tile:hover .paper .back{transform:translate(12px,4px) rotate(6.5deg)}
.sheet-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.doc{position:absolute;inset:0;padding:14px 13px 12px;display:flex;flex-direction:column;gap:11px}
.doc i{display:block;height:4px;border-radius:2px;background:#e9edf3}
.doc-head{display:flex;gap:8px;align-items:center}
.doc-img{width:24px;height:24px;border-radius:5px;background:#eff2f6;flex-shrink:0}
.doc-hl{flex:1;display:flex;flex-direction:column;gap:5px}
.doc-hl i:first-child{height:5px;background:#e1e6ed}
.doc-p{display:flex;flex-direction:column;gap:6px}
.doc-sig{position:absolute;right:12px;bottom:10px;width:38px;height:22px;fill:none;stroke:#cdd3dd;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* the read layer: a clipped copy of the page, tinted, that grows down with --fill */
.read{position:absolute;inset:0;clip-path:inset(0 0 calc(100% - var(--fill,0%)) 0);transition:clip-path .9s var(--ease-out);background:linear-gradient(180deg,rgb(var(--t)/.015),rgb(var(--t)/.04))}
.read .doc i{background:rgb(var(--t)/.18)}
.read .doc-hl i:first-child{background:rgb(var(--t)/.26)}
.read .doc-img{background:rgb(var(--t)/.09)}
.read .doc-sig{stroke:rgb(var(--t)/.5)}
.trail{position:absolute;left:0;right:0;height:56px;top:calc(var(--fill,0%) - 56px);background:linear-gradient(180deg,rgb(var(--t)/0),rgb(var(--t)/.09));transition:top .9s var(--ease-out)}
.scan{position:absolute;left:-7px;right:-7px;top:var(--fill,0%);height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,rgb(var(--t)/0),rgb(var(--t)/.5) 18%,rgb(var(--t)/.62) 50%,rgb(var(--t)/.5) 82%,rgb(var(--t)/0));box-shadow:0 0 8px rgb(var(--t)/.22),0 0 18px rgb(var(--t)/.12);opacity:0;transition:top .9s var(--ease-out),opacity .3s}
.file-tile.run .scan,.file-tile.attn:not(.full) .scan{opacity:1}
.file-tile.run .scan{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
/* finished pages read as signed ink, not a coloured block */
.file-tile.ok .read .doc i{background:#dfe4eb}
.file-tile.ok .read .doc-hl i:first-child{background:#d3d9e2}
.file-tile.ok .read .doc-img{background:#eceff4}
.file-tile.ok .read .doc-sig{stroke:#3d4a63}
.file-tile.ok .trail{opacity:0}
.doc-stamp{position:absolute;top:9px;right:9px;width:16px;height:16px;border-radius:50%;background:rgb(var(--t)/.12);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s var(--ease)}
.doc-stamp svg{width:10px;height:10px;fill:none;stroke:rgb(var(--t));stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.file-tile.ok .doc-stamp{opacity:1;transform:none}

.tile-act{position:absolute;right:10px;bottom:10px;opacity:0;transform:translateY(4px);transition:opacity .18s var(--ease),transform .18s var(--ease);box-shadow:0 4px 12px rgba(16,33,59,.12)}
.file-tile:hover .tile-act,.file-tile.needs .tile-act,.file-tile:focus-within .tile-act{opacity:1;transform:none}
.tile-foot,.folder-foot{padding:11px 13px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tile-name{font-size:12.5px;font-weight:650;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-pct{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.3px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.run .tile-pct{color:var(--blue-d)}.attn .tile-pct,.needs .tile-pct{color:var(--amber)}.ok .tile-pct{color:var(--green)}
.tile-lob{font-size:11.5px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-stage{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:650;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;flex-shrink:0}
.tile-stage.run{background:var(--blue-soft);border-color:var(--blue-border);color:var(--blue-d)}
.tile-stage .pulse{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.7s var(--ease) infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
.tile-stage.attn{color:var(--amber);border-color:#f0d9a8;background:var(--amber-soft)}
.tile-stage.ok{color:var(--green);border-color:#b7e4c7;background:var(--green-soft)}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-80% 0}}

/* Folder view — grey folder, sheet peeking out, frosted front pocket */
.folder-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.folder-card{position:relative;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.folder-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#d6e1f7}
.folder-card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.folder-card.needs{border-color:#f0dcb4}
.folder{position:relative;width:200px;height:150px;filter:drop-shadow(0 14px 16px rgba(16,33,59,.10)) drop-shadow(0 2px 3px rgba(16,33,59,.06));transition:transform .35s var(--ease)}
.folder>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.f-sheet{position:absolute;left:22px;right:22px;top:22px;height:100px;border-radius:6px;background:#fff;padding:11px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(16,33,59,.08);transition:transform .45s var(--ease)}
.f-sheet i{display:block;height:4px;border-radius:2px;background:#eceff3}
.f-sheet i:first-child{width:46%;background:#e2e6ec}.f-sheet i:nth-child(2){width:72%}.f-sheet i:nth-child(3){width:58%}
.f-sheet.s2{left:30px;right:14px;top:28px;background:#f6f7f9;transform:rotate(3deg)}
.folder-card:hover .f-sheet{transform:translateY(-7px)}
.folder-card:hover .f-sheet.s2{transform:translateY(-4px) rotate(4deg)}
.f-front{position:absolute;inset:0;clip-path:path('M8,56 Q8,46 18,46 H70 C77,46 79,58 88,58 H182 Q192,58 192,68 V130 Q192,142 180,142 H20 Q8,142 8,130 Z');background:linear-gradient(180deg,rgba(190,192,198,.78),rgba(168,170,177,.9));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.f-fill{position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:linear-gradient(0deg,rgb(var(--t)/.13),rgb(var(--t)/.04) 75%,rgb(var(--t)/0));transition:height .9s var(--ease-out)}
.folder-card.run .f-front::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);background-size:250% 100%;animation:sheen 3s var(--ease) infinite}
.f-edge path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1}
.f-label{position:absolute;left:20px;right:16px;bottom:17px;display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.f-hex{width:30px;height:32px;flex-shrink:0}
.f-hex path{fill:rgba(110,112,120,.32);stroke:rgba(110,112,120,.32);stroke-width:3;stroke-linejoin:round}
.f-hex text{font:700 10.5px var(--font);fill:#fff;letter-spacing:-.2px}
.f-label>span{min-width:0;display:flex;flex-direction:column}
.f-label b{font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(60,62,70,.18)}
.f-label small{font-size:12px;opacity:.82;line-height:1.3}
.folder-foot{flex-direction:row;align-items:center;justify-content:space-between}
@container (max-width:230px){.paper{scale:.86}.folder{scale:.8}}

.drill{display:flex;flex-direction:column;gap:12px;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.drill-head{display:flex;align-items:center;gap:10px}
.drill-head h2{font-size:16px;font-weight:700;letter-spacing:-.3px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,transform .15s}
.file-row:hover{border-color:#cddcff;transform:translateX(2px)}
.mini-tile{position:relative;width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:#f4f6f9;display:grid;place-items:center}
.mini-sheet{position:relative;width:32px;height:42px;border-radius:3px;background:#fff;border:1px solid #e3e7ee;box-shadow:0 2px 6px rgba(16,33,59,.08);overflow:hidden}
.ml{position:absolute;inset:0;padding:6px 5px;display:flex;flex-direction:column;gap:4px}
.ml i{display:block;height:2.5px;border-radius:2px;background:#e6eaf0}
.read .ml i{background:rgb(var(--t)/.24)}
.file-row b{display:block;font-size:13px;font-weight:650}
.file-row span{font-size:11.5px;color:var(--ink-4)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:650;background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.run{background:var(--blue-soft);color:var(--blue-d);border-color:var(--blue-border)}
.pill.attn{background:var(--amber-soft);color:var(--amber);border-color:#f0d9a8}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:#b7e4c7}

.empty{padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.6)}
.empty h3{font-size:15px;font-weight:650;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);max-width:320px;margin:0 auto}

/* Drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(16,33,59,.3);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.is-on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:50;box-shadow:var(--sh-2);transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column}
.drawer.is-on{transform:none}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-head p{font-size:12px;color:var(--ink-4);margin-top:4px}
.drawer-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.stat small{display:block;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4);margin-bottom:3px}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.step-focus{padding:14px;border-radius:12px;background:radial-gradient(120% 80% at 50% -20%,rgba(59,130,246,.1),transparent 60%),#fff;border:1px solid var(--blue-border)}
.step-focus .lbl{font-size:10px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.step-focus b{font-size:15px;font-weight:700}
.step-focus p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.step-dots{display:flex;gap:5px;margin-top:12px}
.step-dots i{width:7px;height:7px;border-radius:50%;background:#dce3ef}
.step-dots i.on{background:var(--blue);box-shadow:0 0 0 3px rgba(37,96,246,.15)}
.step-dots i.done{background:#93c5fd}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){.page-grid,.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .workspace{grid-template-columns:1fr}
  .upload-rail{position:relative;top:0;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .page-grid,.folder-grid{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="sidebar-logo" src="https://www.figma.com/api/mcp/asset/920b72a7-c011-4c14-963f-f22abbe601db" alt="WiselyConsent">
    </div>
    <nav class="sidebar-nav">
      <div class="nav-lbl">Operate</div>
      <a class="nav-item active" href="#" aria-current="page">Migration</a>
      <a class="nav-item is-muted" href="#">Integrations</a>
      <a class="nav-item is-muted" href="#">Consent Acquisition</a>
    </nav>
    <div class="sidebar-user"><b>Ravi Menon</b><span>Super Admin</span></div>
  </aside>

  <main class="main">
    <div class="workspace">
      <!-- Fixed upload -->
      <aside class="upload-rail" aria-label="Upload consents">
        <div>
          <h1>Upload</h1>
          <p class="lead">One CSV per LoB. The agent prepares files — you only act when asked.</p>
        </div>
        <div class="secure">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          Encrypted v2 · sealed in-browser
        </div>
        <div class="field">
          <label for="lob">Line of business</label>
          <select id="lob">
            <option value="">Select LoB…</option>
            <option>Credit Cards</option>
            <option>Personal Loans</option>
            <option>Savings Accounts</option>
            <option>Home Loans</option>
            <option>Insurance</option>
          </select>
        </div>
        <div class="drop" id="drop" role="button" tabindex="0">
          <b id="fileLabel">Drop CSV here</b>
          <p>Up to 500 MB · One LoB per file</p>
          <button type="button" class="btn btn-sm" id="browse">Choose file</button>
          <button type="button" class="btn btn-ghost btn-sm" id="sample">Try sample</button>
          <input type="file" id="file" accept=".csv" hidden>
        </div>
        <div id="uploadError" class="error" hidden></div>
        <label class="declare">
          <input type="checkbox" id="declare">
          <span>I confirm these consents comply with TRAI regulations and have been verified.</span>
        </label>
        <details class="more">
          <summary>Preparation options</summary>
          <label class="toggle" style="margin-top:8px">
            <input type="checkbox" id="autofix" checked>
            <span>Apply AI autofix automatically</span>
          </label>
        </details>
        <button type="button" class="btn btn-pri btn-full" id="uploadBtn" disabled>Upload &amp; prepare</button>
        <button type="button" class="btn btn-sm" id="seedDemo" style="align-self:flex-start">Load sample queue</button>
      </aside>

      <!-- Right representation -->
      <section class="stage" aria-label="Migration files">
        <div class="stage-bar">
          <div class="filters" role="tablist" aria-label="Filter">
            <button type="button" class="chip-btn is-on" data-filter="all">All <span class="n" id="cAll">0</span></button>
            <button type="button" class="chip-btn" data-filter="needs">Needs you <span class="n" id="cNeeds">0</span></button>
            <button type="button" class="chip-btn" data-filter="run">In progress <span class="n" id="cRun">0</span></button>
            <button type="button" class="chip-btn" data-filter="done">Done <span class="n" id="cDone">0</span></button>
          </div>
          <div class="layouts" role="group" aria-label="Layout">
            <button type="button" class="chip-btn is-on" data-layout="page" title="Page grid">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Page
            </button>
            <button type="button" class="chip-btn" data-layout="folder" title="Folder by LoB">
              <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
              Folders
            </button>
          </div>
        </div>
        <p class="stage-hint" id="hint">Each page fills as the agent reads it.</p>
        <div id="canvas"></div>
      </section>
    </div>
  </main>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3 id="drawerTitle">File</h3>
    <p id="drawerSub"></p>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d5d9"/><stop offset="1" stop-color="#bdbec3"/></linearGradient>
</defs></svg>

<script>
(() => {
  const STAGES = [
    { id:'upload', label:'Uploading', tip:'Sealing and sending your file' },
    { id:'validate', label:'Validating', tip:'Checking columns and formats' },
    { id:'fix', label:'Autofix', tip:'Applying safe format fixes' },
    { id:'verify', label:'Verifying', tip:'Authenticity checks running' },
    { id:'ready', label:'Ready', tip:'Waiting for your go-ahead' }
  ];

  let jobs = [];
  let nextId = 1;
  let picked = null;
  let filter = 'all';
  let layout = 'page';
  let openLob = null;
  let reviewId = null;
  const timers = new Map();

  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num = n => Number(n||0).toLocaleString('en-IN');
  const toast = msg => {
    const t=$('#toast'); t.textContent=msg; t.classList.add('is-on');
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('is-on'),2200);
  };

  const needsYou = j => j.phase==='fix_review' || j.phase==='ready';
  const isRunning = j => ['upload','received','validate','fix','verify'].includes(j.phase);
  const isDone = j => j.phase==='submitted' || j.phase==='cancelled';

  function progress(j) {
    const map = { upload:12, received:22, validate:40, fix:58, fix_review:62, verify:82, ready:100, submitted:100, cancelled:0 };
    return map[j.phase] ?? 0;
  }

  function stageInfo(j) {
    if (j.phase==='fix_review') return { key:'fix', label:'Review autofix', tip:'Safe fixes ready for you', cls:'attn' };
    if (j.phase==='ready') return { key:'ready', label:'Ready to submit', tip:'Authorize when you’re ready', cls:'attn' };
    if (j.phase==='submitted') return { key:'ready', label:'Submitted', tip:'Migration received', cls:'ok' };
    if (j.phase==='cancelled') return { key:'upload', label:'Cancelled', tip:'', cls:'' };
    const i = { upload:0, received:0, validate:1, fix:2, verify:3 }[j.phase] ?? 0;
    const s = STAGES[i];
    return { key:s.id, label:s.label, tip:s.tip, cls: isRunning(j) ? 'run' : '' };
  }

  function tileClass(j) {
    if (needsYou(j)) return 'attn needs';
    if (j.phase==='submitted') return 'ok done';
    if (isRunning(j)) return 'run';
    return '';
  }

  function updateUpload() {
    $('#uploadBtn').disabled = !(picked && $('#declare').checked && $('#lob').value);
  }

  function pick(name, size) {
    const err=$('#uploadError'); err.hidden=true; picked=null;
    $('#fileLabel').textContent='Drop CSV here';
    $('#drop').classList.remove('is-picked');
    updateUpload();
    if (!name.toLowerCase().endsWith('.csv')) { err.textContent='Choose a CSV file.'; err.hidden=false; return; }
    if (size > 500*1024*1024) { err.textContent='Over 500 MB limit.'; err.hidden=false; return; }
    picked={name,size};
    $('#drop').classList.add('is-picked');
    $('#fileLabel').textContent=name;
    updateUpload();
  }

  function filtered() {
    return jobs.filter(j => {
      if (filter==='needs') return needsYou(j);
      if (filter==='run') return isRunning(j);
      if (filter==='done') return isDone(j);
      return true;
    });
  }

  /* deterministic per-file layout so every page looks a little different */
  const SIG = 'M3 16c2-5 5-11 7-10s-3 12-1 13 5-9 7-9-1 7 1 7 3-5 5-4 1 4 3 3l9-4';
  function seeded(n) {
    let x = (n * 2654435761) >>> 0 || 1;
    return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  }
  function docHTML(id) {
    const r = seeded(id + 7), w = (a, b) => Math.round(a + r() * (b - a));
    const L = ws => ws.map(x => `<i style="width:${x}%"></i>`).join('');
    return `<div class="doc">
      <div class="doc-head"><span class="doc-img"></span><span class="doc-hl">${L([w(58,74), w(82,96), w(40,56)])}</span></div>
      <div class="doc-p">${L([100, w(86,98), w(58,78)])}</div>
      <div class="doc-p">${L([w(94,100), w(72,90), w(80,96), w(36,56)])}</div>
      <svg class="doc-sig" viewBox="0 0 40 24"><path d="${SIG}"/></svg>
    </div>`;
  }

  function fileTile(j) {
    const pct = progress(j);
    const st = stageInfo(j);
    const act = j.phase==='ready'
      ? `<button class="btn btn-pri btn-sm tile-act" data-act="review" data-id="${j.id}">Submit</button>`
      : j.phase==='fix_review'
        ? `<button class="btn btn-pri btn-sm tile-act" data-act="fix" data-id="${j.id}">Review</button>`
        : j.phase==='submitted'
          ? `<button class="btn btn-sm tile-act" data-act="receipt" data-id="${j.id}">Receipt</button>`
          : '';
    const doc = docHTML(j.id);
    return `<article class="file-tile ${tileClass(j)}${pct>=100?' full':''}" style="--fill:${pct}%" data-key="t${j.id}" data-sig="${j.phase}" data-fk="t${j.id}" data-to="${pct}" data-id="${j.id}" tabindex="0" role="button" title="${esc(st.tip)}" aria-label="${esc(j.name)}, ${pct}% ${st.label}">
      <div class="tile-art">
        <div class="paper" aria-hidden="true">
          <span class="back"></span>
          <div class="sheet">
            <div class="sheet-clip">${doc}<div class="read">${doc}<span class="trail"></span></div></div>
            <span class="scan"></span>
            <span class="doc-stamp"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>
          </div>
        </div>
        ${act}
      </div>
      <div class="tile-foot">
        <div class="tile-row"><span class="tile-name" title="${esc(j.name)}">${esc(j.name)}</span><span class="tile-pct">${pct}%</span></div>
        <div class="tile-row"><span class="tile-lob">${esc(j.lob)}</span><span class="tile-stage ${st.cls}">${st.cls==='run'||st.cls==='attn'?'<i class="pulse"></i>':''}${esc(st.label)}</span></div>
      </div>
    </article>`;
  }

  function miniTile(j) {
    const pct = progress(j);
    const ml = '<div class="ml"><i style="width:60%"></i><i></i><i style="width:85%"></i><i></i><i style="width:50%"></i></div>';
    return `<div class="mini-tile ${tileClass(j)}" style="--fill:${pct}%" data-fk="m${j.id}" data-to="${pct}">
      <div class="mini-sheet">${ml}<div class="read">${ml}</div></div>
    </div>`;
  }

  function foldersFrom(list) {
    const map = {};
    list.forEach(j => {
      if (!map[j.lob]) map[j.lob] = [];
      map[j.lob].push(j);
    });
    return Object.entries(map);
  }

  const F_BACK = 'M8,34 Q8,22 20,22 H116 C122,22 124,12 132,12 H180 Q192,12 192,24 V130 Q192,142 180,142 H20 Q8,142 8,130 Z';
  const F_FRONT = 'M8,56 Q8,46 18,46 H70 C77,46 79,58 88,58 H182 Q192,58 192,68 V130 Q192,142 180,142 H20 Q8,142 8,130 Z';
  const HEX = 'M15 2.5 L26.5 9 V23 L15 29.5 L3.5 23 V9 Z';

  function folderCard(lob, files) {
    const avg = Math.round(files.reduce((s,j)=>s+progress(j),0) / files.length);
    const need = files.filter(needsYou).length;
    const run = files.filter(isRunning).length;
    const allDone = files.every(j => j.phase==='submitted');
    const st = need ? `Needs you · ${need}` : run ? `Agent working · ${run}` : 'Up to date';
    const cls = need ? 'needs' : run ? 'run' : allDone ? 'ok' : '';
    const pill = need ? 'attn' : run ? 'run' : allDone ? 'ok' : '';
    const initials = lob.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<article class="folder-card ${cls}" style="--fill:${avg}%" data-key="f${esc(lob)}" data-sig="${avg}|${cls}|${files.length}|${need}|${run}" data-fk="f${esc(lob)}" data-to="${avg}" data-lob="${esc(lob)}" tabindex="0" role="button" aria-label="${esc(lob)}, ${files.length} files, ${avg}%">
      <div class="folder-art">
        <div class="folder" aria-hidden="true">
          <svg viewBox="0 0 200 150"><path d="${F_BACK}" fill="url(#fBack)"/><path d="M146 17h14M166 17h7" stroke="#e6e7ea" stroke-width="3" stroke-linecap="round"/></svg>
          ${files.length > 1 ? '<span class="f-sheet s2"></span>' : ''}
          <span class="f-sheet"><i></i><i></i><i></i></span>
          <div class="f-front"><span class="f-fill"></span></div>
          <svg class="f-edge" viewBox="0 0 200 150"><path d="${F_FRONT}"/></svg>
          <div class="f-label">
            <svg class="f-hex" viewBox="0 0 30 32"><path d="${HEX}"/><text x="15" y="19.6" text-anchor="middle">${esc(initials)}</text></svg>
            <span><b>${esc(lob)}</b><small>${num(files.reduce((s,j)=>s+(j.total||0),0))} records</small></span>
          </div>
        </div>
      </div>
      <div class="folder-foot">
        <span class="tile-stage ${pill}">${pill==='run'||pill==='attn'?'<i class="pulse"></i>':''}${esc(st)}</span>
        <span class="tile-pct">${avg}%</span>
      </div>
    </article>`;
  }

  /* Keep unchanged tiles in place so their loops don't restart, and animate
     every fill from the value it last showed, so pages visibly fill up. */
  const lastFill = new Map();
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function patch(canvas, html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html.trim();
    const next = tpl.content.firstElementChild, cur = canvas.firstElementChild;
    const keys = el => [...el.children].map(c => c.dataset.key).join('|');
    if (cur && next && next.dataset.view && cur.dataset.view === next.dataset.view && keys(cur) === keys(next)) {
      const curKids = [...cur.children];
      [...next.children].forEach((n, i) => { if (curKids[i].dataset.sig !== n.dataset.sig) curKids[i].replaceWith(n); });
    } else {
      canvas.replaceChildren(tpl.content);
    }
    animateFills(canvas);
  }
  function animateFills(root) {
    const moving = [];
    $$('[data-fk]', root).forEach(el => {
      const to = +el.dataset.to, from = lastFill.has(el.dataset.fk) ? lastFill.get(el.dataset.fk) : 0;
      lastFill.set(el.dataset.fk, to);
      if (from === to || RM) return;
      el.style.setProperty('--fill', from + '%');
      moving.push([el, from, to]);
    });
    if (!moving.length) return;
    root.getBoundingClientRect();
    moving.forEach(([el, from, to]) => {
      el.style.setProperty('--fill', to + '%');
      const pct = $(':scope > .tile-foot .tile-pct, :scope > .folder-foot .tile-pct', el);
      if (!pct) return;
      const t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        pct.textContent = Math.round(from + (to - from) * e) + '%';
        if (k < 1 && pct.isConnected) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  function empty(msg, sub) {
    return `<div class="empty"><h3>${msg}</h3><p>${sub}</p></div>`;
  }

  function render() {
    const list = filtered();
    $('#cAll').textContent = jobs.length;
    $('#cNeeds').textContent = jobs.filter(needsYou).length;
    $('#cRun').textContent = jobs.filter(isRunning).length;
    $('#cDone').textContent = jobs.filter(isDone).length;

    const canvas = $('#canvas');
    if (!jobs.length) {
      openLob = null;
      $('#hint').innerHTML = 'Upload on the left — pages appear here and <strong>fill as the agent reads them</strong>.';
      patch(canvas, empty('No files yet', 'Your first upload will show up in the page grid.'));
      return;
    }

    if (layout === 'folder' && openLob) {
      const files = list.filter(j => j.lob === openLob);
      $('#hint').innerHTML = `<strong>${esc(openLob)}</strong> · ${files.length} file${files.length===1?'':'s'} in this view`;
      patch(canvas, `<div class="drill">
        <div class="drill-head">
          <button type="button" class="btn btn-sm" id="backFolders">← Folders</button>
          <h2>${esc(openLob)}</h2>
        </div>
        <div class="file-list">${files.length ? files.map(j => {
          const pct=progress(j); const st=stageInfo(j);
          return `<div class="file-row" data-id="${j.id}" tabindex="0">
            ${miniTile(j)}
            <div><b>${esc(j.name)}</b><span>${esc(st.label)} · ${pct}%</span></div>
            <span class="pill ${st.cls}">${esc(st.label)}</span>
            ${j.phase==='ready'?`<button class="btn btn-pri btn-sm" data-act="review" data-id="${j.id}">Submit</button>`:
              j.phase==='fix_review'?`<button class="btn btn-pri btn-sm" data-act="fix" data-id="${j.id}">Review</button>`:'<span></span>'}
          </div>`;
        }).join('') : empty('No files here', 'Try another filter.')}
        </div>
      </div>`);
      $('#backFolders').onclick = () => { openLob=null; render(); };
      return;
    }

    if (layout === 'folder') {
      const groups = foldersFrom(list);
      $('#hint').textContent = 'Folders group files by LoB. Open one to see each file’s fill.';
      patch(canvas, groups.length
        ? `<div class="folder-grid" data-view="folder">${groups.map(([lob, files]) => folderCard(lob, files)).join('')}</div>`
        : empty('Nothing in this filter', 'Switch filter or upload another file.'));
      return;
    }

    openLob = null;
    $('#hint').innerHTML = 'Each page fills as the agent reads it, a soft wash following the scan line.';
    patch(canvas, list.length
      ? `<div class="page-grid" data-view="page">${list.map(fileTile).join('')}</div>`
      : empty('Nothing in this filter', 'Try All, or upload a new file.'));
  }

  function schedule(j) {
    clearTimeout(timers.get(j.id));
    const delays = { upload:900, received:700, validate:1300, fix:1500, verify:1400 };
    const tick = () => {
      const job = jobs.find(x => x.id === j.id);
      if (!job || isDone(job) || needsYou(job)) return;
      if (job.phase==='upload') job.phase='received';
      else if (job.phase==='received') job.phase='validate';
      else if (job.phase==='validate') {
        job.phase='fix';
        job.valid=Math.round(job.total*.9);
        job.fixed=Math.round(job.total*.06);
        job.manual=Math.round(job.total*.03);
        job.dup=job.total-job.valid-job.fixed-job.manual;
      } else if (job.phase==='fix') {
        if (job.autofix) { job.fixedApplied=job.fixed; job.phase='verify'; toast(`${job.lob}: auto-fixed`); }
        else { job.phase='fix_review'; render(); toast(`${job.lob}: needs review`); return; }
      } else if (job.phase==='verify') {
        job.verified=job.valid+(job.fixedApplied||0);
        job.failed=Math.round(job.total*.04);
        job.phase='ready'; render(); toast(`${job.lob}: ready`); return;
      }
      render();
      if (!needsYou(job) && !isDone(job)) timers.set(job.id, setTimeout(tick, delays[job.phase]||900));
    };
    timers.set(j.id, setTimeout(tick, delays[j.phase]||700));
  }

  function startJob({lob,name,size,autofix}) {
    if (jobs.some(j => j.lob===lob && !isDone(j))) {
      $('#uploadError').textContent=`${lob} already has a file in progress.`;
      $('#uploadError').hidden=false; return;
    }
    const job = {
      id:nextId++, lob, name, size, autofix, phase:'upload',
      total:80000+Math.floor(Math.random()*180000),
      valid:0,fixed:0,manual:0,dup:0,verified:0,failed:0,fixedApplied:0
    };
    jobs=[job,...jobs];
    picked=null; $('#declare').checked=false; $('#file').value='';
    $('#drop').classList.remove('is-picked'); $('#fileLabel').textContent='Drop CSV here';
    updateUpload(); render(); schedule(job); toast(`Received ${name}`);
  }

  function openDrawer(job, mode) {
    reviewId=job.id;
    $('#drawerBg').classList.add('is-on');
    $('#drawer').classList.add('is-on');
    $('#drawer').setAttribute('aria-hidden','false');
    $('#drawerTitle').textContent=job.lob;
    $('#drawerSub').textContent=job.name;
    const st=stageInfo(job);
    const order=['upload','validate','fix','verify','ready'];
    const idx=order.indexOf(st.key);
    const dots=order.map((_,i)=>`<i class="${i<idx?'done':i===idx?'on':''}"></i>`).join('');
    const focus=`<div class="step-focus"><div class="lbl">Current focus</div><b>${esc(st.label)}</b><p>${esc(st.tip)}</p><div class="step-dots">${dots}</div></div>`;

    if (mode==='fix') {
      $('#drawerBody').innerHTML=`${focus}<div class="stat-grid"><div class="stat"><small>Safe fixes</small><b>${num(job.fixed)}</b></div><div class="stat"><small>Manual</small><b>${num(job.manual)}</b></div></div><p class="caption">Apply format-safe fixes, or skip and continue.</p>`;
      $('#drawerFoot').innerHTML=`<button class="btn" data-d="close">Close</button><button class="btn" data-d="skip">Skip</button><button class="btn btn-pri" data-d="apply">Apply</button>`;
    } else {
      const cost=Math.round((job.verified||0)*.05*1.18);
      $('#drawerBody').innerHTML=`${focus}<div class="stat-grid"><div class="stat"><small>Eligible</small><b>${num(job.verified)}</b></div><div class="stat"><small>Estimate</small><b>₹${cost.toLocaleString('en-IN')}</b></div></div>`;
      $('#drawerFoot').innerHTML=mode==='receipt'
        ? `<button class="btn btn-pri" data-d="close">Done</button>`
        : `<button class="btn" data-d="close">Not now</button><button class="btn btn-pri" data-d="submit">Authorize</button>`;
    }
  }

  function closeDrawer() {
    reviewId=null;
    $('#drawerBg').classList.remove('is-on');
    $('#drawer').classList.remove('is-on');
    $('#drawer').setAttribute('aria-hidden','true');
  }

  function applyFix(job, apply) {
    job.fixedApplied=apply?job.fixed:0;
    job.phase='verify';
    closeDrawer(); render(); schedule(job);
    toast(apply?'Autofix applied':'Continued without autofix');
  }

  // Upload events
  $('#browse').onclick=e=>{e.stopPropagation();$('#file').click();};
  $('#sample').onclick=e=>{
    e.stopPropagation();
    if(!$('#lob').value)$('#lob').value='Credit Cards';
    pick(`${$('#lob').value.toLowerCase().replace(/\s+/g,'_')}_sample.csv`,12.4*1048576);
  };
  $('#file').onchange=()=>{const f=$('#file').files[0];if(f)pick(f.name,f.size);};
  $('#drop').onclick=e=>{if(!e.target.closest('button'))$('#file').click();};
  ['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('is-drag');}));
  ['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('is-drag');}));
  $('#drop').addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)pick(f.name,f.size);});
  $('#declare').onchange=updateUpload;
  $('#lob').onchange=updateUpload;
  $('#uploadBtn').onclick=()=>{
    if(!picked||!$('#lob').value||!$('#declare').checked)return;
    startJob({lob:$('#lob').value,name:picked.name,size:picked.size,autofix:$('#autofix').checked});
  };

  $$('.filters .chip-btn').forEach(btn=>btn.onclick=()=>{
    filter=btn.dataset.filter;
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b===btn));
    render();
  });
  $$('.layouts .chip-btn').forEach(btn=>btn.onclick=()=>{
    layout=btn.dataset.layout;
    openLob=null;
    $$('.layouts .chip-btn').forEach(b=>b.classList.toggle('is-on',b===btn));
    render();
  });

  $('#canvas').addEventListener('click', e => {
    const act=e.target.closest('[data-act]');
    if(act){
      const job=jobs.find(j=>j.id===+act.dataset.id);
      if(!job)return;
      if(act.dataset.act==='review')openDrawer(job,'submit');
      if(act.dataset.act==='fix')openDrawer(job,'fix');
      if(act.dataset.act==='receipt')openDrawer(job,'receipt');
      e.stopPropagation(); return;
    }
    const folder=e.target.closest('[data-lob]');
    if(folder){ openLob=folder.dataset.lob; render(); return; }
    const tile=e.target.closest('.file-tile,[data-id].file-row');
    if(tile){
      const job=jobs.find(j=>j.id===+tile.dataset.id);
      if(!job)return;
      if(job.phase==='ready')openDrawer(job,'submit');
      else if(job.phase==='fix_review')openDrawer(job,'fix');
      else if(job.phase==='submitted')openDrawer(job,'receipt');
      else openDrawer(job,'receipt');
    }
  });

  $('#drawerFoot').addEventListener('click', e => {
    const b=e.target.closest('[data-d]'); if(!b)return;
    const job=jobs.find(j=>j.id===reviewId);
    const a=b.dataset.d;
    if(a==='close')closeDrawer();
    if(a==='apply'&&job)applyFix(job,true);
    if(a==='skip'&&job)applyFix(job,false);
    if(a==='submit'&&job){ job.phase='submitted'; closeDrawer(); render(); toast(`${job.lob} submitted`); }
  });
  $('#drawerBg').onclick=closeDrawer;

  $('#seedDemo').onclick=()=>{
    jobs.forEach(j=>clearTimeout(timers.get(j.id))); timers.clear();
    jobs=[
      {id:nextId++,lob:'Credit Cards',name:'credit_cards_sept.csv',autofix:true,phase:'ready',total:100000,valid:90000,fixed:6000,manual:3000,dup:1000,verified:96000,failed:4000,fixedApplied:6000},
      {id:nextId++,lob:'Credit Cards',name:'credit_cards_aug.csv',autofix:true,phase:'verify',total:80000,valid:72000,fixed:4800,manual:2400,dup:800,verified:0,failed:0,fixedApplied:4800},
      {id:nextId++,lob:'Personal Loans',name:'personal_loans_sept.csv',autofix:false,phase:'fix_review',total:250000,valid:225000,fixed:15000,manual:7500,dup:2500,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Personal Loans',name:'personal_loans_july.csv',autofix:true,phase:'validate',total:120000,valid:0,fixed:0,manual:0,dup:0,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Savings Accounts',name:'savings_oct.csv',autofix:true,phase:'fix',total:180000,valid:162000,fixed:10800,manual:5400,dup:1800,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Home Loans',name:'home_loans_aug.csv',autofix:true,phase:'submitted',total:72000,valid:65000,fixed:4000,manual:2000,dup:1000,verified:69000,failed:3000,fixedApplied:4000},
      {id:nextId++,lob:'Insurance',name:'insurance_q3.csv',autofix:true,phase:'upload',total:45000,valid:0,fixed:0,manual:0,dup:0,verified:0,failed:0,fixedApplied:0},
      {id:nextId++,lob:'Insurance',name:'insurance_q2.csv',autofix:true,phase:'submitted',total:51000,valid:48000,fixed:2000,manual:800,dup:200,verified:49000,failed:1000,fixedApplied:2000},
      {id:nextId++,lob:'Savings Accounts',name:'savings_sep.csv',autofix:false,phase:'received',total:95000,valid:0,fixed:0,manual:0,dup:0,verified:0,failed:0,fixedApplied:0}
    ];
    filter='all'; layout='page'; openLob=null;
    $$('.filters .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.filter==='all'));
    $$('.layouts .chip-btn').forEach(b=>b.classList.toggle('is-on',b.dataset.layout==='page'));
    render();
    jobs.filter(isRunning).forEach(schedule);
    toast('Sample queue · try Page and Folders');
  };

  render();
  updateUpload();
})();
</script>
</body>
</html>
